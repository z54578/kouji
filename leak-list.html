<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>漏洩検査 台帳</title>
<style>
:root{--bg:#ECEEEC;--surface:#FFFFFF;--ink:#1C2326;--muted:#5E676B;--line:#C9CED0;--focus:#1F4E8C;--sel:#1C2326;--sel-ink:#FFFFFF;--err:#B42318;--err-soft:#FDECEA;--ok:#2E7D4F;--info:#1F4E8C;--info-soft:#DCE6F3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;--sel:#E8ECEE;--sel-ink:#161A1C;--err:#F59B91;--err-soft:#3A1F1C;--ok:#6BC48F;--info:#9DBDEB;--info-soft:#24344A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;--sel:#E8ECEE;--sel-ink:#161A1C;--err:#F59B91;--err-soft:#3A1F1C;--ok:#6BC48F;--info:#9DBDEB;--info-soft:#24344A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 140px}
.back{display:inline-block;margin:0 0 6px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:.9rem}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 6px}
h2{font-size:1.05rem;margin:0 0 6px}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);margin-top:10px}
label.f:first-of-type{margin-top:4px}
input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1.05rem;padding:8px 10px}
input.bad,textarea.bad{border-color:var(--err);background:var(--err-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chips.bad .chip{border-color:var(--err)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sub{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sub b{display:block}
.msg{font-size:.82rem;color:var(--err);margin-top:4px}
.info{background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 12px;font-size:.9rem}
.kv{display:grid;grid-template-columns:7em 1fr;gap:2px 10px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:640px;margin:0 auto}
.bar button,.btn{width:100%;min-height:50px;border-radius:10px;border:0;background:var(--sel);color:var(--sel-ink);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.bar button[aria-disabled="true"]{background:var(--line);color:var(--muted)}
.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.state{text-align:center;font-size:.85rem;margin-bottom:6px}
.state.ng{color:var(--err)} .state.ok{color:var(--ok)}
.miss{margin:6px 0 0;padding-left:1.2em;font-size:.85rem;color:var(--err)}
.add{width:100%;min-height:44px;margin-top:10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.del{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font-family:inherit;cursor:pointer;float:right}
.chk{display:flex;gap:10px;align-items:center;min-height:46px;font-size:1rem}
.chk input{width:24px;height:24px;min-height:0}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:1.6rem;line-height:1.2}
.sum span{font-size:.8rem;color:var(--muted)}
.sum .o{border-color:var(--err)} .sum .o b{color:var(--err)}
.sum .n{border-color:var(--info)} .sum .n b{color:var(--info)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;font-weight:700}
.mh span{font-weight:400;color:var(--muted);font-size:.9rem}
.mh.o{color:var(--err)} .mh.n{color:var(--info)}
a.site{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--ink);text-decoration:none}
a.site.o{border-left-color:var(--err)} a.site.n{border-left-color:var(--info)}
.due{text-align:center;line-height:1.15}
.due b{display:block;font-size:1.25rem}
.due span{font-size:.75rem;color:var(--muted)}
a.site.o .due b{color:var(--err)}
.nm{font-weight:700;line-height:1.35}
.meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-right:4px;color:var(--muted)}
.tag.r{border-color:var(--err);color:var(--err)}
.search{width:100%;margin-top:10px}
.sitebox{margin-bottom:8px}
.sitebox a.site{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.acts2{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--surface);overflow:hidden}
.acts2 a{display:flex;align-items:center;justify-content:center;min-height:42px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;border-left:1px solid var(--line)}
.acts2 a:first-child{border-left:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>漏洩検査 台帳</h1>
  <p class="lead">次の期限が近い順に並んでいます。現場をタップすると記録用紙が開きます。</p>
  <div class="sum" id="sum"></div>
  <div class="chips" id="areas" style="margin-top:12px"></div>
  <input class="search" id="q" type="search" placeholder="現場名・住所で探す" aria-label="現場を探す">
  <div id="list"></div>
</div>
<script>
(function(){
  var esc = function(t){ return String(t==null?"":t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var all = [], area = "すべて", q = "";
  var now = new Date(), ty = now.getFullYear(), tm = now.getMonth();
  function region(a){ var m = String(a||"").replace(/^.+?[都道府県]/, "").match(/^(?:.+?郡)?(.+?[市町村])/); return m ? m[1] : "地域不明"; }
  function months(c){ c = String(c||""); var y = c.match(/([0-9.]+)\s*年/), mo = c.match(/([0-9]+)\s*(か月|ヶ月|カ月|月)/); if(y) return Math.round(parseFloat(y[1])*12); if(mo) return +mo[1]; if(/半年/.test(c)) return 6; return 12; }
  function due(s){ if(!s.last) return null; var p = s.last.split("-"), d = new Date(+p[0], +p[1]-1+months(s.cycle), +p[2]); return d; }
  function ym(d){ return d.getFullYear()*12+d.getMonth(); }
  function cls(d){ if(!d) return "o"; var today = new Date(ty, tm, now.getDate()); if(d < today) return "o"; if(ym(d) === ty*12+tm) return "n"; return ""; }
  function draw(){
    var key = q.trim();
    var items = all.filter(function(s){ return (area === "すべて" || s.region === area) && (!key || (s.site+s.fac+s.addr).indexOf(key) >= 0); });
    var over = all.filter(function(s){ return cls(s.due) === "o"; }).length, cur = all.filter(function(s){ return cls(s.due) === "n"; }).length;
    var nx = all.filter(function(s){ return s.due && ym(s.due) === ty*12+tm+1; }).length;
    document.getElementById("sum").innerHTML = '<div class="o"><b>'+over+'</b><span>期限切れ</span></div><div class="n"><b>'+cur+'</b><span>今月が期限</span></div><div><b>'+nx+'</b><span>来月が期限</span></div>';
    var cnt = {}; all.forEach(function(s){ cnt[s.region] = (cnt[s.region]||0)+1; });
    var areas = ["すべて"].concat(Object.keys(cnt).sort());
    document.getElementById("areas").innerHTML = areas.map(function(a){ return '<button type="button" class="chip" data-a="'+esc(a)+'" aria-pressed="'+(a===area)+'">'+esc(a)+'（'+(a==="すべて"?all.length:cnt[a])+'）</button>'; }).join("");
    document.querySelectorAll("[data-a]").forEach(function(b){ b.onclick = function(){ area = b.dataset.a; draw(); }; });
    var h = "", g = null;
    items.forEach(function(s){
      var c = cls(s.due), key2 = c === "o" ? "期限切れ" : s.due.getFullYear()+"年"+(s.due.getMonth()+1)+"月";
      if(key2 !== g){
        g = key2;
        var n = items.filter(function(x){ var c2 = cls(x.due); return (c2 === "o" ? "期限切れ" : x.due.getFullYear()+"年"+(x.due.getMonth()+1)+"月") === g; }).length;
        h += '<div class="mh '+(c==="o"?"o":c==="n"?"n":"")+'">'+g+(c==="n"?"（今月）":"")+'<span>'+n+'件</span></div>';
      }
      var d = s.due;
      var tel = ((s.contacts||[])[0]||{}).tel || s.tel || "";
      h += '<div class="sitebox '+c+'"><a class="site '+c+'" href="./leak.html?id='+encodeURIComponent(s.id)+'"><div class="due">'+(d ? '<b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b><span>'+d.getFullYear()+'年</span>' : '<b>？</b><span>前回不明</span>')+'</div><div><div class="nm">'+esc(s.site)+(s.fac ? '　'+esc(s.fac) : '')+'</div>'+
        '<div class="meta">'+esc(s.region)+'・'+esc(s.addr)+'</div><div class="meta"><span class="tag">タンク'+s.tanks.length+'基</span><span class="tag">検知管'+esc(s.wells||"−")+'本</span>'+(s.hasMob ? '<span class="tag">移動タンク'+s.mob.length+'台</span>' : '')+(c==="o" ? '<span class="tag r">要対応</span>' : '')+'</div>'+
        '<div class="meta">前回 '+esc(s.prevDate||"不明")+'（No.'+esc(s.prevNo||"不明")+'）・周期 '+esc(s.cycle||"1年")+'</div></div></a>'+
        '<div class="acts2">'+(s.addr ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.addr)+'" target="_blank" rel="noopener">ナビ</a>' : '')+(tel ? '<a href="tel:'+tel.replace(/[^0-9+]/g,"")+'">電話</a>' : '')+'<a href="./leak.html?id='+encodeURIComponent(s.id)+'">記録用紙</a></div></div>';
    });
    document.getElementById("list").innerHTML = h || '<p class="lead" style="margin-top:16px">該当する現場がありません。</p>';
  }
  document.getElementById("q").addEventListener("input", function(e){ q = e.target.value; draw(); });
  fetch("sites.json", {cache:"no-cache"}).then(function(r){ return r.json(); }).then(function(list){
    var done = {}; try{ done = JSON.parse(localStorage.getItem("leak-done-v1")) || {}; }catch(e){}
    all = list.map(function(s){ var o = done[s.id]; if(o && (!s.last || o.last > s.last)){ s.last = o.last; s.prevDate = o.prevDate; s.prevNo = o.prevNo; } s.region = region(s.addr); s.due = due(s); return s; });
    all.sort(function(a,b){ if(!a.due) return -1; if(!b.due) return 1; return a.due - b.due; });
    draw();
  }).catch(function(){ document.getElementById("list").innerHTML = '<p class="lead" style="margin-top:16px">台帳を読み込めませんでした。電波のある所で開き直してください。</p>'; });
})();
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
