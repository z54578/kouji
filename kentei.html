<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="theme-color" content="#1C2326">
<link rel="icon" href="icon-192.png" type="image/png">
<title>検定</title>
<style>
:root{--bg:#ECEEEC;--surface:#FFFFFF;--ink:#1C2326;--muted:#475055;--line:#B4BCC0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;color-scheme:dark}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:18px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 40px}
a.back{display:inline-block;padding:8px 0;color:var(--ink);text-decoration:none;font-size:1rem}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card p{margin:0}
.card p + p{margin-top:8px;color:var(--muted);font-size:.9rem}
.lead{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.kb{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:10px;padding:16px;margin-bottom:12px;color:var(--ink);font-family:inherit;cursor:pointer}
.kb b{display:block;font-size:1.25rem}.kb b small{font-size:.95rem;font-weight:400;margin-left:4px;color:var(--muted)}
.kb span{font-size:.88rem;color:var(--muted)}
.kback{min-height:44px;padding:0 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.khead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}.khead b{font-size:1.2rem}.khead span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>検定</h1>
  <div id="app"></div>
</div>
<script>
(function(){
  // 検定：計量器（7年）・ローリー（5年）。中身は準備中
  var K = {meter:{n:"計量器", y:"7年", d:"給油所の計量器（ノズルごと）の検定"}, lorry:{n:"ローリー", y:"5年", d:"タンクローリーの検定"}};
  var app = document.getElementById("app"), sel = "";
  function draw(){
    if(!sel){
      app.innerHTML = '<p class="lead">検定の種類を選んでください。</p>'+Object.keys(K).map(function(k){ var x = K[k];
        return '<button type="button" class="kb" data-k="'+k+'"><b>'+x.n+'<small>（'+x.y+'）</small></b><span>'+x.d+'</span></button>'; }).join("");
      app.querySelectorAll("[data-k]").forEach(function(b){ b.onclick = function(){ sel = b.dataset.k; draw(); window.scrollTo(0,0); }; });
    } else {
      var x = K[sel];
      app.innerHTML = '<button type="button" class="kback" id="kback">← 種類を選び直す</button><div class="khead"><b>'+x.n+'の検定</b><span>有効期間 '+x.y+'</span></div>'+
        '<div class="card"><p>準備中です。</p><p>中身が決まったら、ここに入れます。</p></div>';
      document.getElementById("kback").onclick = function(){ sel = ""; draw(); };
    }
  }
  draw();
})();
</script>
</body>
</html>
