<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工事課ツール">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>工事課ツール</title>
<style>
:root{--bg:#ECEEEC;--surface:#FFFFFF;--ink:#1C2326;--muted:#5E676B;--line:#C9CED0;--focus:#1F4E8C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.7rem;margin:4px 0 4px}
p{color:var(--muted);margin:0 0 20px;font-size:.95rem}
a.tool{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:10px;padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none}
a.tool b{display:block;font-size:1.15rem}
a.tool span{font-size:.88rem;color:var(--muted)}
a.tool svg{width:64px;height:44px}
a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.foot{font-size:.8rem;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>工事課ツール</h1>
  <p>使うアプリを選んでください。一度開けば、電波のない現場でも使えます。</p>
  <a class="tool" href="./pc.html">
    <svg viewBox="0 0 48 32" aria-hidden="true"><circle cx="24" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="16" r="8" fill="none" stroke="#2F6FD6" stroke-width="4"/></svg>
    <div><b>PC打設量計算</b><span>配管ごとに、パイプコーティングの主剤（白）と硬化剤（青）の量を出す</span></div>
  </a>
  <a class="tool" href="./thread.html">
    <svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor"><path d="M4 11 H27 V27" stroke-width="9"/><path d="M4 4.5 V17.5 M20.5 27 H33.5" stroke-width="2.5"/></svg>
    <div><b>ねじ込み配管 切断長計算</b><span>エルボ・チーズ・ソケット・フランジなどから、管を切る長さを出す</span></div>
  </a>
  <a class="tool" href="./weld.html">
    <svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor"><path d="M4 11 H12 A15 15 0 0 1 27 26 V28" stroke-width="9"/><path d="M4 4.5 V17.5 M20.5 28 H33.5" stroke-width="2.5"/></svg>
    <div><b>溶接配管 切断長計算</b><span>突合せ溶接継手・SOPフランジから、管を切る長さを出す</span></div>
  </a>
  <a class="tool" href="./zfile.html">
    <svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="24" cy="16" r="13" stroke-width="2.5"/><circle cx="24" cy="16" r="6.5" stroke-width="2.5"/></svg>
    <div><b>Zファイル</b><span>材料・工具・機械・車両の説明、月次点検、棚卸し、見積・注文</span></div>
  </a>
  <a class="tool" href="./fill.html">
    <svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor"><rect x="10" y="3" width="24" height="26" rx="2" stroke-width="2.5"/><path d="M15 10 H29 M15 16 H29 M15 22 H23" stroke-width="2"/><path d="M30 24 L42 12 L45 15 L33 27 L29 28 Z" stroke-width="2"/></svg>
    <div><b>未登録の記入フォーム</b><span>Zファイルの空欄を、わかる所から書いて送る</span></div>
  </a>
  <div class="foot">継手の寸法はJISの規格値です。使い始めは手元の継手で実測して確かめてください。</div>
</div>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
