<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PC打設量計算</title>
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --ink:#1C2326; --muted:#5E676B; --line:#C9CED0;
  --white-bg:#FFFFFF; --white-ink:#1C2326; --white-line:#AEB6BA;
  --blue-bg:#2F6FD6; --blue-ink:#FFFFFF;
  --field:#FFF3A6; --field-line:#D9C200; --focus:#1F4E8C; --sel:#1C2326; --sel-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
    --white-bg:#EEF1F2; --white-ink:#1C2326; --white-line:#EEF1F2;
    --blue-bg:#3D7FE6; --blue-ink:#FFFFFF;
    --field:#3B3713; --field-line:#8F8320; --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
  --white-bg:#EEF1F2; --white-ink:#1C2326; --white-line:#EEF1F2;
  --blue-bg:#3D7FE6; --blue-ink:#FFFFFF;
  --field:#3B3713; --field-line:#8F8320; --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.back{display:inline-block;padding:4px 0;color:var(--muted);text-decoration:none;font-size:.9rem}
h1{font-size:1.4rem;margin:2px 0 10px}
.num{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{flex:none;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:.85rem;color:var(--muted);margin:2px 0 6px;font-weight:700}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.chip{min-height:46px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.6rem;cursor:pointer;font-family:inherit}
.stepper input{flex:1;min-width:0;height:54px;text-align:right;padding:0 12px;font-size:1.6rem;font-family:inherit;border:2px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:10px}
.unit{font-size:1.1rem;color:var(--muted)}
.auto{margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:700}
details.more{margin-top:10px}
details.ol{margin:0 0 8px}
details.ol summary{font-size:.9rem}
details.ol[open]{background:var(--bg);border-radius:10px;padding:0 8px 2px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:10px}
.seg .chip{min-height:42px;font-size:.92rem;padding:0 2px}
.oils{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.oils .chip{font-size:.9rem;white-space:nowrap;padding:0 4px}
.lines{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.lines .chip{font-size:.9rem;padding:0 2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px var(--muted);margin-right:5px;vertical-align:-1px}
.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.guide{border:2px solid var(--ink)}
.prog{display:flex;align-items:center;gap:4px;margin-bottom:10px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.prog span{padding:2px 7px;border-radius:9px;background:var(--bg)}
.prog span.now{background:var(--sel);color:var(--sel-ink);font-weight:700}
.prog span.ok{text-decoration:line-through;opacity:.6}
.stage{font-size:.9rem;font-weight:700;color:var(--muted)}
.todo{display:grid;grid-template-columns:1fr 136px;gap:10px;align-items:center;margin:6px 0 12px}
.todo .say{font-size:1.25rem;font-weight:700;line-height:1.4}
.todo .say big{display:block;font-size:2.5rem;line-height:1.1;margin:0 0 6px}
.todo .say > span{display:block;font-size:1rem}
.todo .say big i{font-style:normal;font-size:1.1rem;margin-left:2px}
.blue{color:#2F6FD6}
.go{width:100%;min-height:62px;border:0;border-radius:14px;background:var(--sel);color:var(--sel-ink);font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer}
.times{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.times .chip{min-height:56px;font-size:.95rem;white-space:nowrap;padding:0 2px}
.count{text-align:center;margin:8px 0 12px}
.count b{display:block;font-size:3rem;line-height:1.1}
.subbtns{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.lnk.armed{color:#B42318;font-weight:700;text-decoration:none}
.del.armed{border-color:#B42318;color:#B42318;font-weight:700}
.lnk{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:6px 0}
.hint{color:var(--muted);font-size:.9rem;margin:4px 0}
.note{font-size:.78rem;color:var(--muted);margin-top:4px}
.alarm{position:fixed;inset:0;z-index:60;background:#B42318;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.alarm[hidden]{display:none}
.al-in{text-align:center;max-width:420px}
.al-ic{font-size:3.5rem}
.alarm b{display:block;font-size:1.2rem;margin-top:8px}
.alarm p{font-size:1.6rem;font-weight:700;margin:8px 0 24px;line-height:1.35}
.alarm button{min-width:200px;min-height:64px;border-radius:14px;border:0;background:#fff;color:#B42318;font:inherit;font-size:1.4rem;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<div class="alarm" id="alarm" hidden role="alertdialog" aria-live="assertive"><div class="al-in"><div class="al-ic" aria-hidden="true">⏰</div><b></b><p></p><button type="button" id="alstop">止める</button></div></div>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>PC打設量計算</h1>
  <div class="tabs" id="tabs" role="group" aria-label="配管"></div>
  <div class="card" id="input"></div>
  <div class="card guide" id="guide" aria-live="polite"></div>
  <p class="note">タイマー中は<b>ANMを開いたまま</b>にしてください（画面は消えないようにしています）。閉じると音が鳴らないことがあるので、スマホの時計のタイマーも一緒に使うと安心です。</p>
</div>
<script>
(function(){
  var KGM = {20:0.06,25:0.07,32:0.12,40:0.12,50:0.15,65:0.2,80:0.24,100:0.6};
  var SIZES = [20,25,32,40,50,65,80,100];
  var SG = 1.2, MAX = 6, CAP = 12, TMINS = [45,60,90,120,150];
  var COATS = { normal:[1.1,1.0], holed:[1.32,1.2] };
  var OILS = ["レギュラー","ハイオク","軽油","灯油","重油"], LINES = ["通気管","注入管","吸引管","戻り管"];
  var OILC = {"レギュラー":"#D93025","ハイオク":"#F2C200","軽油":"#2E9E4F","灯油":"#2F6FD6","重油":"#000000"};
  function dot(o){ return '<span class="dot" style="background:'+OILC[o]+'" aria-hidden="true"></span>'; }
  var KEY = "pc-guide-v1";
  function newPipe(){ return {size:100, len:0, kind:"normal", nMan:0, oil:"", line:"", flow:{c:0, st:"mix"}}; }
  var st;
  try{ st = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!st || !Array.isArray(st.pipes) || !st.pipes.length) st = {cur:0, pipes:[newPipe()]};
  if(st.cur >= st.pipes.length) st.cur = 0;
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  var num = function(v){ var n = parseFloat(String(v).replace(/[^0-9.]/g,"")); return isFinite(n) ? n : 0; };
  var f1 = function(n){ return (Math.round(n*10)/10).toFixed(1); };
  var mix = function(t){ var h = Math.ceil(Math.round(t/3*1e6)/1e5 - 1e-6)/10; return {h:h, s:h*3}; };
  function base(p){ return num(p.len) * KGM[p.size] * SG; }
  function autoN(p){ var s = mix(base(p)*COATS[p.kind][0]).s; return Math.max(1, Math.min(3, Math.ceil(s/CAP - 1e-9))); }
  function nOf(p){ return p.nMan || autoN(p); }
  function amt(p, c){ var n = nOf(p), x = mix(base(p)*COATS[p.kind][c]/n); return {n:n, h:x.h, s:x.s}; }
  function name(p, i){ return "配管"+(i+1)+(p.oil ? "・"+p.oil : "")+(p.line ? "・"+p.line : ""); }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function bucket(h, s, step){
    var H = 100, top = 20, bot = 120, y = function(kg){ return bot - Math.min(1, kg/CAP)*H; };
    var yh = y(h), ys = y(s);
    var fadeW = step === "h" ? 'fill="none" stroke="#9AA4A9" stroke-dasharray="4 3"' : 'fill="#F2F4F5" stroke="#1C2326" stroke-width="2"';
    return '<svg viewBox="0 0 136 130" width="136" height="130" aria-hidden="true">' +
      '<path d="M18 '+top+' L102 '+top+' L94 '+bot+' L26 '+bot+' Z" fill="none" stroke="#5E676B" stroke-width="3"/>' +
      '<line x1="12" x2="108" y1="'+top+'" y2="'+top+'" stroke="#B42318" stroke-dasharray="3 3"/><text x="60" y="'+(top-5)+'" text-anchor="middle" font-size="9" fill="#B42318">12kg</text>' +
      '<rect x="27" y="'+ys+'" width="66" height="'+(yh-ys)+'" '+fadeW+'/>' +
      '<rect x="27" y="'+yh+'" width="66" height="'+(bot-yh)+'" fill="#2F6FD6" '+(step==="h" ? 'stroke="#1C2326" stroke-width="2"' : '')+'/>' +
      '<text x="60" y="'+Math.min(bot-4, (yh+bot)/2+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">青 '+f1(h)+'</text>' +
      (s > h ? '<text x="60" y="'+Math.max(top+10, (ys+yh)/2+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(step==="h" ? '#9AA4A9' : '#1C2326')+'">白を足す</text>' : '') +
      '<text x="106" y="'+(ys+4)+'" font-size="10" font-weight="700" fill="currentColor">'+f1(s)+'</text></svg>';
  }

  function drawTabs(){
    var t = document.getElementById("tabs");
    t.innerHTML = st.pipes.map(function(p, i){ return '<button type="button" data-tab="'+i+'" aria-pressed="'+(i===st.cur)+'">'+(p.oil ? dot(p.oil) : '')+esc(name(p,i))+(p.flow.st==="wait" ? " ⏱" : "")+'</button>'; }).join("") +
      (st.pipes.length < MAX ? '<button type="button" id="addp">＋ 配管</button>' : '');
    t.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ st.cur = +b.dataset.tab; save(); drawAll(); }; });
    var a = document.getElementById("addp"); if(a) a.onclick = function(){ var last = st.pipes[st.pipes.length-1]; var np = newPipe(); np.size = last.size; np.oil = last.oil; st.pipes.push(np); st.cur = st.pipes.length-1; save(); drawAll(); };
  }
  function drawInput(){
    var p = st.pipes[st.cur], box = document.getElementById("input"), an = autoN(p);
    box.style.borderLeft = p.oil ? "8px solid "+OILC[p.oil] : "";
    var sel = [p.oil, p.line].filter(Boolean).join("・");
    box.innerHTML = '<details class="more ol" id="olbox"><summary>油種・配管の種類'+(sel ? '：<b>'+esc(sel)+'</b>' : '（必要なときだけ）')+'</summary><div class="lbl">油種</div><div class="oils">'+OILS.map(function(o){ return '<button type="button" class="chip" data-oil="'+o+'" aria-pressed="'+(p.oil===o)+'">'+dot(o)+o+'</button>'; }).join("")+'</div>' +
      '<div class="lbl">配管の種類</div><div class="lines">'+LINES.map(function(o){ return '<button type="button" class="chip" data-line="'+o+'" aria-pressed="'+(p.line===o)+'">'+o+'</button>'; }).join("")+'</div></details>' +
      '<div class="lbl">サイズ</div><div class="sizes">'+SIZES.map(function(s){ return '<button type="button" class="chip" data-size="'+s+'" aria-pressed="'+(p.size===s)+'">'+s+'A</button>'; }).join("")+'</div>' +
      '<div class="lbl">長さ</div><div class="stepper"><button type="button" data-d="-1" aria-label="1m減らす">−</button><input class="num" inputmode="decimal" aria-label="長さ（m）" value="'+(p.len||0)+'"><button type="button" data-d="1" aria-label="1m増やす">＋</button><span class="unit">m</span></div>' +
      (num(p.len) > 0 ? '<div class="auto">'+(nOf(p) > 1 ? '12kgを超えるので、<b>容器'+nOf(p)+'個</b>に分けて作ります' : '容器1個で作れます')+(p.nMan ? '（手動）' : '')+'</div>' : '') +
      '<details class="more"><summary>その他（穴あき・容器の数）</summary>' +
        '<div class="lbl">配管</div><div class="seg"><button type="button" class="chip" data-kind="normal" aria-pressed="'+(p.kind==="normal")+'">通常</button><button type="button" class="chip" data-kind="holed" aria-pressed="'+(p.kind==="holed")+'">穴あき</button></div>' +
        '<div class="lbl">容器（12L）の数</div><div class="seg"><button type="button" class="chip" data-n="0" aria-pressed="'+(!p.nMan)+'">自動（'+an+'個）</button>'+[1,2,3].map(function(n){ return '<button type="button" class="chip" data-n="'+n+'" aria-pressed="'+(p.nMan===n)+'">'+n+'個</button>'; }).join("")+'</div>' +
        (st.pipes.length > 1 ? '<button type="button" class="del" id="delp">この配管を消す</button>' : '') +
      '</details>';
    box.querySelectorAll("details").forEach(function(det){ var k = det.id || "more"; if(drawInput.op && drawInput.op[k]) det.open = true; det.addEventListener("toggle", function(){ drawInput.op = drawInput.op || {}; drawInput.op[k] = det.open; }); });
    box.querySelectorAll("[data-size]").forEach(function(b){ b.onclick = function(){ p.size = +b.dataset.size; save(); drawAll(); }; });
    box.querySelectorAll("[data-kind]").forEach(function(b){ b.onclick = function(){ p.kind = b.dataset.kind; save(); drawAll(); }; });
    box.querySelectorAll("[data-n]").forEach(function(b){ b.onclick = function(){ p.nMan = +b.dataset.n; save(); drawAll(); }; });
    box.querySelectorAll("[data-oil]").forEach(function(b){ b.onclick = function(){ p.oil = p.oil===b.dataset.oil ? "" : b.dataset.oil; save(); drawAll(); }; });
    box.querySelectorAll("[data-line]").forEach(function(b){ b.onclick = function(){ p.line = p.line===b.dataset.line ? "" : b.dataset.line; save(); drawAll(); }; });
    var inp = box.querySelector("input");
    inp.addEventListener("input", function(){ p.len = num(inp.value); save(); drawTabs(); drawGuide(); var a = box.querySelector(".auto"); if(!a && num(p.len) > 0) drawInput(); });
    inp.addEventListener("change", function(){ drawInput(); });
    inp.addEventListener("focus", function(){ inp.select(); });
    box.querySelectorAll("[data-d]").forEach(function(b){ b.onclick = function(){ p.len = Math.max(0, Math.round((num(p.len) + (+b.dataset.d))*10)/10); save(); drawAll(); }; });
    var d = document.getElementById("delp"); if(d) twice(d, "もう一度押すと消します", function(){ st.pipes.splice(st.cur,1); st.cur = 0; save(); drawAll(); });
  }
  function progress(f){
    var items = [["c0m","1回目の打設"],["c0w","⏱ 待ち"],["c1m","2回目の打設"],["c1w","⏱ 待ち"]];
    var cur = "c"+f.c+(f.st==="wait" ? "w" : "m"), idx = f.st==="done" ? 99 : items.findIndex(function(x){ return x[0]===cur; });
    return '<div class="prog">'+items.map(function(x, i){ return '<span class="'+(i===idx ? "now" : i<idx ? "ok" : "")+'">'+x[1]+'</span>'; }).join("")+'</div>';
  }
  function drawGuide(){
    var p = st.pipes[st.cur], f = p.flow, g = document.getElementById("guide");
    if(!(num(p.len) > 0)){ g.innerHTML = '<div class="say" style="font-size:1.1rem;font-weight:700">サイズと長さを入れると、やることが出ます。</div>'; return; }
    var a = amt(p, f.c), coat = (f.c+1)+"回目の打設", h = '';
    h += progress(f);
    if(f.st !== "wait" && f.st !== "done"){
      h += '<div class="stage">'+coat+(a.n > 1 ? '　容器'+a.n+'個（どれも同じ量）' : '')+'</div>';
      h += '<div class="todo"><div class="say"><span class="blue">① 青（硬化剤）</span><big class="num blue">'+f1(a.h)+'<i>kg</i></big><span>② 白を足して合計</span><big class="num">'+f1(a.s)+'<i>kg</i></big></div>'+bucket(a.h, a.s, "s")+'</div>';
      h += '<div class="hint" style="margin-bottom:6px">'+(f.c===0 ? '打設が終わったら、2回目までの時間を押す' : '打設が終わったら、アラームまでの時間を押す')+'</div>';
      h += '<div class="times">'+TMINS.map(function(m){ return '<button type="button" class="chip" data-min="'+m+'">'+m+'分</button>'; }).join("")+'</div>';
    } else if(f.st === "wait"){
      h += '<div class="stage">'+(f.c===0 ? '2回目の打設まで' : '2回目の打設から'+f.mins+'分まで')+'</div><div class="count"><b class="num" id="left">'+mmss(f.end-Date.now())+'</b></div>';
      h += '<div class="hint" style="text-align:center">時間になったら音で知らせます</div>';
    } else {
      h += '<div class="todo" style="grid-template-columns:1fr"><div class="say">この配管はおわりました</div></div><button type="button" class="go" id="restart">もう一度はじめから</button>';
    }
    if(f.st !== "done") h += '<div class="subbtns">'+(f.st==="wait" || f.c===1 ? '<button type="button" class="lnk" id="backstep">← 1つ戻る</button>' : '<span></span>')+'<button type="button" class="lnk" id="reset">はじめからやり直す</button></div>';
    g.innerHTML = h;
    g.querySelectorAll("[data-min]").forEach(function(b){ b.onclick = function(){ unlockAudio(); f.st = "wait"; f.mins = +b.dataset.min; f.end = Date.now() + f.mins*60000; save(); drawAll(); keepAwake(true); }; });
    var bk = document.getElementById("backstep");
    if(bk){ if(f.st==="wait") twice(bk, "もう一度押すとタイマーをやめます", function(){ f.st="mix"; save(); drawAll(); });
            else bk.onclick = function(){ if(f.c===1){ f.c=0; f.st="mix"; } save(); drawAll(); }; }
    var rs = document.getElementById("reset"); if(rs) twice(rs, "もう一度押すと、長さとタイマーを消して最初に戻ります", function(){ p.flow = {c:0, st:"mix"}; p.len = 0; save(); drawAll(); });
    var re = document.getElementById("restart"); if(re) re.onclick = function(){ p.flow = {c:0, st:"mix"}; save(); drawAll(); };
  }
  function twice(btn, msg, act){
    btn.onclick = function(){
      if(btn.dataset.armed){ act(); return; }
      btn.dataset.armed = "1"; var old = btn.textContent; btn.textContent = msg; btn.classList.add("armed");
      setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; btn.classList.remove("armed"); } }, 3000);
    };
  }
  function drawAll(){ drawTabs(); drawInput(); drawGuide(); keepAwake(st.pipes.some(function(p){ return p.flow.st==="wait"; })); }

  // ---- 音・画面
  var actx = null, beepTimer = null, wake = null, ringing = null;
  function unlockAudio(){ try{ if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); } if(actx.state === "suspended") actx.resume(); }catch(e){} }
  function beep(){ if(!actx) return; try{ var o = actx.createOscillator(), gn = actx.createGain(); o.type = "square"; o.frequency.value = 1100; gn.gain.value = 0.25; o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.35); }catch(e){} }
  async function keepAwake(on){ try{ if(on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", function(){ wake = null; }); } if(!on && wake){ await wake.release(); wake = null; } }catch(e){} }
  function mmss(ms){ var t = Math.max(0, Math.ceil(ms/1000)), hh = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60; return (hh ? hh+":"+String(m).padStart(2,"0") : m)+":"+String(s).padStart(2,"0"); }
  function ring(i){
    var p = st.pipes[i], f = p.flow; ringing = i;
    var ov = document.getElementById("alarm");
    ov.querySelector("b").textContent = name(p, i);
    ov.querySelector("p").textContent = f.c===0 ? "2回目の打設の時間です" : "2回目の打設から "+f.mins+"分たちました";
    ov.hidden = false; beep(); beepTimer = setInterval(function(){ beep(); if(navigator.vibrate) navigator.vibrate(300); }, 700);
  }
  document.getElementById("alstop").addEventListener("click", function(){
    var i = ringing; ringing = null; if(beepTimer){ clearInterval(beepTimer); beepTimer = null; }
    document.getElementById("alarm").hidden = true;
    if(i !== null && st.pipes[i]){ var f = st.pipes[i].flow; if(f.c===0){ st.pipes[i].flow = {c:1, st:"mix"}; } else { f.st = "done"; } st.cur = i; save(); }
    drawAll();
  });
  setInterval(function(){
    var now = Date.now(), el = document.getElementById("left"), p = st.pipes[st.cur];
    if(el && p && p.flow.st==="wait") el.textContent = mmss(p.flow.end - now);
    if(ringing !== null) return;
    for(var i=0;i<st.pipes.length;i++){ var f = st.pipes[i].flow; if(f.st==="wait" && now >= f.end){ ring(i); break; } }
  }, 1000);
  document.addEventListener("touchstart", unlockAudio, {passive:true}); document.addEventListener("click", unlockAudio);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) drawAll(); });
  drawAll();
})();
</script>
