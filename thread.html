<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ねじ込み配管 切断長計算</title>
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --ink:#1C2326; --muted:#475055; --line:#B4BCC0;
  --field:#FFF3A6; --field-line:#D9C200; --focus:#1F4E8C; --sel:#1C2326; --sel-ink:#FFFFFF;
  --cut:#1F4E8C; --cut-soft:#DCE6F3;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
    --field:#3B3713; --field-line:#8F8320; --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C;
    --cut:#9DBDEB; --cut-soft:#24344A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
  --field:#3B3713; --field-line:#8F8320; --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C;
  --cut:#9DBDEB; --cut-soft:#24344A; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;line-height:1.25;margin:4px 0 12px;font-weight:700}
h2{font-size:1.05rem;margin:22px 0 8px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.chip{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;padding:0 6px}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.fieldname{font-size:.85rem;color:var(--muted);margin:12px 0 6px}
.fieldname:first-child{margin-top:0}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fits{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fits .chip{font-size:.92rem}
.fits .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;min-height:76px;line-height:1.25}
.fits .chip svg,.shape svg{width:44px;height:28px;flex:none}
.ico{display:flex;gap:4px}
.sizes .chip{min-height:52px;padding:4px 2px;line-height:1.15}
.sizes .chip small{display:block;font-size:.78rem;font-weight:400}
.shapes{display:grid;gap:8px;margin-bottom:12px}
.shape{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.shape b{display:block}
.shape span{font-size:.85rem;color:var(--muted)}
.fig{margin:14px 0 0;color:var(--muted)}
.kinds2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:.8rem;margin-top:2px}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{flex:1;min-width:0;height:52px;text-align:right;padding:0 12px;font-size:1.5rem;font-family:inherit;border:2px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:8px}
.inrow .unit{color:var(--muted)}
.manual{margin-top:8px}
.manual input{height:44px;font-size:1.15rem}
.answer{background:var(--cut-soft);color:var(--cut);border-radius:10px;padding:14px;margin-top:14px}
.answer .lbl{font-size:.9rem;font-weight:700}
.answer .big{font-size:2.6rem;line-height:1.1;font-weight:700}
.answer .big small{font-size:1rem;font-weight:400;margin-left:4px}
.answer .how{font-size:.85rem;margin-top:6px;color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted)}
.btn{width:100%;height:50px;margin-top:12px;border-radius:10px;border:0;background:var(--sel);color:var(--sel-ink);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.item .t{font-size:.85rem;color:var(--muted)}
.item b{font-size:1.25rem}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:36px;height:36px;font-size:1rem;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:.9rem;cursor:pointer}
.actions{display:flex;justify-content:flex-end;margin-top:10px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:700;font-size:.8rem}
th:first-child,td:first-child{text-align:left;font-weight:700}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.back{display:inline-block;margin:0 0 6px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:.9rem}
.refs{display:grid;gap:6px;margin-bottom:8px}
.refs > div{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:6px}
.refs span{font-weight:700;font-size:.9rem}
#fit1,#fit2{display:none}
.pp{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:0;margin-bottom:6px}
.pe{min-height:96px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.pe[aria-expanded="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.pe .ico svg{height:28px;width:auto}
.pe b{font-size:.92rem;line-height:1.25;text-align:center}
.pe small{font-size:.72rem;color:var(--muted)}
.pbar{height:16px;background:var(--cut);border-radius:3px}
.fitpop{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:10px;margin-bottom:8px}
.fitpop .pt{grid-column:1/3;font-weight:700;font-size:.9rem}
.fitpop button{min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 8px;text-align:left}
.fitpop button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fitpop .ico svg{height:22px;width:auto}
details.figs{margin:6px 0 10px}
details.figs summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
.resbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--ink);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.resbar .answer{margin:0;padding:0;background:none;min-height:0}
.resbar .answer .big{font-size:2.1rem;line-height:1.1}
.resbar .answer .lbl{font-size:.75rem}
.resbar .answer .how{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.resbar .answer .hint{font-size:.85rem;padding:0;background:none}
.resbar .btn{margin:0;min-height:56px;padding:0 14px;font-size:.9rem;white-space:nowrap}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h2 .cnt{font-size:.85rem;font-weight:700;color:#2F6FD6;margin-left:6px}
.item{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:8px}
.item b{font-size:1.6rem}
.item b small{font-size:.85rem}
.ck{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer}
.ck[aria-pressed="true"]{background:#2E9E4F;border-color:#2E9E4F}
.item.done b{text-decoration:line-through;color:var(--muted)}
.ng{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ngh{font-size:.95rem;margin-bottom:6px}
.bar{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;margin:4px 0}
.bl{font-size:.75rem;color:var(--muted);font-weight:700}
.bt{display:flex;height:40px;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.bt span{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cut);color:#fff;font-size:.78rem;font-weight:700;border-right:2px solid var(--surface);min-width:0;overflow:hidden;white-space:nowrap}
.bt span i{font-style:normal;font-size:.62rem;font-weight:400;opacity:.85}
.bt span.dn{background:#2E9E4F}
.bt span.rs{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 6px,var(--line) 6px,var(--line) 8px);color:var(--muted);border-right:0}
.btn.share{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>ねじ込み配管 切断長計算</h1>


  <section id="calc">
    <div class="card">

      <div class="fieldname">サイズ</div>
      <div class="sizes" id="sizes"></div>

      <div class="fieldname">測り方</div>
      <div class="kinds2" id="mode"></div>
      <div id="m-cc">
      <div class="fieldname">芯々寸法（継手の中心から中心まで。フランジ側はフランジ面まで）</div>
      <div class="inrow"><input id="cc" class="num" inputmode="decimal" aria-label="芯々寸法（mm）" placeholder="0"><span class="unit">mm</span></div>
      </div>
      <div id="m-wall" hidden>
        <div class="fieldname">壁から端1の継手の中心まで（フランジは面まで）</div>
        <div class="inrow"><input id="w1" class="num" inputmode="decimal" aria-label="壁から端1の中心まで（mm）" placeholder="0"><span class="unit">mm</span></div>
        <div class="fieldname">壁から端2の継手の中心まで（フランジは面まで）</div>
        <div class="inrow"><input id="w2" class="num" inputmode="decimal" aria-label="壁から端2の中心まで（mm）" placeholder="0"><span class="unit">mm</span></div>
        <p class="note">同じ壁から2か所を測ると、その差が芯々寸法になります。切断リストに追加すると、端2の数字が次の管の端1に移ります。</p>
      </div>
      <div id="m-face" hidden>
        <figure class="fig">
          <svg viewBox="0 0 340 130" role="img" aria-label="面間と切断長の関係の図">
            <rect x="20" y="52" width="70" height="36" rx="4" style="fill:var(--line)"/>
            <rect x="250" y="52" width="70" height="36" rx="4" style="fill:var(--line)"/>
            <path d="M66 70 H274" stroke-width="14" style="stroke:var(--cut)"/>
            <path d="M90 14 V60 M250 14 V60" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
            <path d="M92 26 H248" stroke="currentColor" stroke-width="1.5" marker-start="url(#arm)" marker-end="url(#arm)"/>
            <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">面間（継手の端から端）</text>
            <path d="M66 80 V122 M274 80 V122" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
            <path d="M68 116 H272" stroke-width="1.5" style="stroke:var(--cut)" marker-start="url(#arc)" marker-end="url(#arc)"/>
            <text x="170" y="110" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--cut)">切断長</text>
            <text x="78" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">ℓ</text>
            <text x="262" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">ℓ</text>
          </svg>
          <figcaption>継手の端から端（面間）を測ります。管は両側の継手にねじ込む分（ℓ）だけ長く切るので、面間＋両側のℓが切断長です。</figcaption>
        </figure>
        <div class="fieldname">どこからどこまで測ったか</div>
        <div class="refs"><div><span>端1</span><div class="kinds2" id="r1"></div></div><div><span>端2</span><div class="kinds2" id="r2"></div></div></div>
        <div class="fieldname" id="fflbl">面間（継手の端から端まで。フランジ側はフランジ面まで）</div>
        <div class="inrow"><input id="ff" class="num" inputmode="decimal" aria-label="面間（mm）" placeholder="0"><span class="unit">mm</span></div>
      </div>

      <details class="figs"><summary>図で見る（芯々・壁から）</summary>
      <figure class="fig" id="fig-cc">
        <svg viewBox="0 0 340 150" role="img" aria-label="芯々寸法と切断長の関係の図">
          <defs>
            <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
            <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--cut)"/></marker>
          </defs>
          <path d="M40 102 V70 H80" fill="none" stroke-width="26" style="stroke:var(--line)"/>
          <path d="M260 70 H300 V102" fill="none" stroke-width="26" style="stroke:var(--line)"/>
          <path d="M62 70 H278" stroke-width="14" style="stroke:var(--cut)"/>
          <text x="170" y="74" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">管</text>
          <path d="M40 16 V128 M300 16 V128" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
          <circle cx="40" cy="70" r="2.5" fill="currentColor"/><circle cx="300" cy="70" r="2.5" fill="currentColor"/>
          <path d="M42 32 H298" stroke="currentColor" stroke-width="1.5" marker-start="url(#arm)" marker-end="url(#arm)"/>
          <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">芯々寸法（継手の中心から中心）</text>
          <path d="M62 80 V128 M278 80 V128" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
          <path d="M64 122 H276" stroke-width="1.5" style="stroke:var(--cut)" marker-start="url(#arc)" marker-end="url(#arc)"/>
          <text x="170" y="142" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--cut)">切断長（管を切る長さ）</text>
          <text x="51" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">G</text>
          <text x="289" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">G</text>
        </svg>
        <figcaption>灰色が継手、青が管。芯々寸法から両端のG（継手の中心から管の先まで）を引いた長さが切断長です。</figcaption>
      </figure>
      <figure class="fig" id="fig-wall" hidden>
        <svg viewBox="0 0 340 170" role="img" aria-label="壁から測るときの芯々寸法と切断長の図">
          <defs>
            <marker id="arm2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
            <marker id="arc2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--cut)"/></marker>
            <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V6" stroke="currentColor" stroke-width="1.5"/></pattern>
          </defs>
          <rect x="6" y="8" width="16" height="140" style="fill:var(--line)"/>
          <rect x="6" y="8" width="16" height="140" fill="url(#hatch)"/>
          <text x="14" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">壁</text>
          <path d="M90 112 V80 H130" fill="none" stroke-width="26" style="stroke:var(--line)"/>
          <path d="M260 80 H300 V112" fill="none" stroke-width="26" style="stroke:var(--line)"/>
          <path d="M112 80 H278" stroke-width="14" style="stroke:var(--cut)"/>
          <text x="195" y="84" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--surface)">管</text>
          <path d="M90 14 V144 M300 14 V144" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
          <circle cx="90" cy="80" r="2.5" fill="currentColor"/><circle cx="300" cy="80" r="2.5" fill="currentColor"/>
          <path d="M24 26 H88" stroke="currentColor" stroke-width="1.5" marker-start="url(#arm2)" marker-end="url(#arm2)"/>
          <text x="56" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">壁→端1</text>
          <path d="M24 50 H298" stroke="currentColor" stroke-width="1.5" marker-start="url(#arm2)" marker-end="url(#arm2)"/>
          <text x="195" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">壁→端2</text>
          <path d="M112 90 V146 M278 90 V146" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
          <path d="M114 140 H276" stroke-width="1.5" style="stroke:var(--cut)" marker-start="url(#arc2)" marker-end="url(#arc2)"/>
          <text x="195" y="160" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--cut)">切断長（管を切る長さ）</text>
          <text x="101" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">G</text>
          <text x="289" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">G</text>
        </svg>
        <figcaption>同じ壁から端1と端2の継手の中心を測ります。その差が芯々寸法で、そこから両端のGを引いた長さが切断長です。</figcaption>
      </figure>
      </details>
      <div class="fieldname">継手（管の左右をタップして選ぶ）</div>
      <div class="pp"><button type="button" class="pe" id="pe1" aria-label="端1の継手を選ぶ"></button><div class="pbar" aria-hidden="true"></div><button type="button" class="pe" id="pe2" aria-label="端2の継手を選ぶ"></button></div>
      <div class="fitpop" id="fitpop" hidden></div>
      
      <div class="fits" id="fit1"></div>
      <div class="manual inrow" id="man1" hidden><input class="num" inputmode="decimal" aria-label="端1の差し引き寸法（mm）" placeholder="差し引く寸法"><span class="unit">mm</span></div>

      
      <div class="fits" id="fit2"></div>
      <div class="manual inrow" id="man2" hidden><input class="num" inputmode="decimal" aria-label="端2の差し引き寸法（mm）" placeholder="差し引く寸法"><span class="unit">mm</span></div>

      <div class="resbar">
      <div class="answer num" id="answer" aria-live="polite"></div>
      <button class="btn" id="save" type="button">リストに追加</button>
      </div>
    </div>

    <h2>切断リスト <span class="cnt" id="lcnt"></span></h2>
    <div class="list" id="list"></div>
    <h2>4m管の取り方</h2>
    <div id="nest"></div>
    <div class="actions"><button class="btn share" id="share" type="button">Teamsで送る（共有）</button><button class="ghost" id="clear" type="button">リストを全部消す</button></div>
  </section>

  
</div>

<script>
(function(){
  var S = [
    {a:15,b:"1/2",od:21.7,t:2.8,n:14},{a:20,b:"3/4",od:27.2,t:2.8,n:14},{a:25,b:"1",od:34.0,t:3.2,n:11},
    {a:32,b:"1 1/4",od:42.7,t:3.5,n:11},{a:40,b:"1 1/2",od:48.6,t:3.5,n:11},{a:50,b:"2",od:60.5,t:3.8,n:11},
    {a:65,b:"2 1/2",od:76.3,t:4.2,n:11},{a:80,b:"3",od:89.1,t:4.2,n:11},{a:100,b:"4",od:114.3,t:4.5,n:11}
  ];
  // JIS B 2301 I形
  var EL = {L:[27,32,38,46,48,57,69,78,97], l:[11,13,15,17,18,20,23,25,28], G:[16,19,23,29,30,37,46,53,69]};
  var E45 = {L:[21,25,29,34,37,42,49,54,65], G:[10,12,14,17,19,22,26,29,37]};
  var SO = {L:[35,40,45,50,55,60,70,75,85], G:[13,14,15,16,19,20,24,25,29]};
  var sv = function(inner){ return '<svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round">'+inner+'</svg>'; };
  var IC = {
    el: sv('<path d="M4 11 H27 V27" stroke-width="9"/><path d="M4 4.5 V17.5 M20.5 27 H33.5" stroke-width="2.5"/>'),
    tee: sv('<path d="M3 11 H45 M24 11 V27" stroke-width="9"/><path d="M3 4.5 V17.5 M45 4.5 V17.5 M17.5 27 H30.5" stroke-width="2.5"/>'),
    e45: sv('<path d="M4 23 H18 L31 10" stroke-width="9"/><path d="M4 16.5 V29.5 M26.5 5.5 L35.5 14.5" stroke-width="2.5"/>'),
    so: sv('<path d="M2 16 H46" stroke-width="3"/><rect x="14" y="9" width="20" height="14" rx="2" fill="currentColor" stroke="none"/>'),
    un: sv('<path d="M2 16 H46" stroke-width="3"/><rect x="7" y="10" width="9" height="12" rx="1.5" fill="currentColor" stroke="none"/><rect x="32" y="10" width="9" height="12" rx="1.5" fill="currentColor" stroke="none"/><path d="M19 6 H29 L32.5 16 L29 26 H19 L15.5 16 Z" stroke-width="2.5"/>'),
    fl: sv('<path d="M2 16 H30" stroke-width="7"/><rect x="30" y="2" width="7" height="28" rx="1" fill="currentColor" stroke="none"/><path d="M39 7 H46 M39 25 H46" stroke-width="2.5"/>'),
    none: sv('<path d="M4 16 H34" stroke-width="9"/><path d="M38 8 V24" stroke-width="1.5" stroke-dasharray="2 2"/>')
  };
  var FITS = [
    {k:"el", name:"90°エルボ・チーズ", ic:IC.el+IC.tee},
    {k:"e45", name:"45°エルボ", ic:IC.e45},
    {k:"so", name:"ソケット", ic:IC.so},
    {k:"un", name:"ユニオン（入力）", ic:IC.un},
    {k:"fl", name:"ねじ込みフランジ", ic:IC.fl},
    {k:"none", name:"継手なし（管端）", ic:IC.none}
  ];
  var SHAPES = [
    {n:"90°エルボ", ic:IC.el, d:"管を90°に曲げる"},
    {n:"チーズ", ic:IC.tee, d:"T字型。3方向に分ける。寸法は90°エルボと同じ"},
    {n:"45°エルボ", ic:IC.e45, d:"管を45°に曲げる"},
    {n:"ソケット", ic:IC.so, d:"同じ太さの管をまっすぐつなぐ"},
    {n:"ユニオン", ic:IC.un, d:"真ん中のナットを回すと外せるつなぎ。パッキンを使う"},
    {n:"ねじ込みフランジ", ic:IC.fl, d:"管にねじ込み、ボルトで機器や配管と締める。パッキンを使う"}
  ];
  var KEY = "thread-pipe-calc-v1";
  var st = {i:5, f1:"el", f2:"el", m1:"", m2:"", cc:"", list:[], mode:"cc", w1:"", w2:"", ff:"", r1:"face", r2:"face"};
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && typeof s === "object") for(var k in s) st[k] = s[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  var num = function(v){ var n = parseFloat(String(v).replace(/[^0-9.]/g,"")); return isFinite(n) ? n : NaN; };
  var fmt = function(n){ return (Math.round(n*10)/10).toString(); };

  function ded(f, m){
    var i = st.i;
    if(f === "el") return {v:EL.G[i], why:"エルボ・チーズ G"+EL.G[i]};
    if(f === "e45") return {v:E45.G[i], why:"45°エルボ G"+E45.G[i]};
    if(f === "so") return {v:SO.G[i]/2, why:"ソケット G"+SO.G[i]+"の半分 "+fmt(SO.G[i]/2)};
    if(f === "fl") return {v:3, why:"フランジ面から控え 3"};
    if(f === "none") return {v:0, why:"継手なし 0"};
    var v = num(m); return {v:v, why:(f==="un"?"ユニオン ":"フランジ ")+(isNaN(v)?"未入力":fmt(v)), manual:true};
  }
  // 面間で測るときに足す寸法（ねじ込み量ℓ）
  function addl(f, m){
    var i = st.i;
    if(f === "el" || f === "e45" || f === "so") return {v:EL.l[i], why:"ねじ込み "+EL.l[i]};
    if(f === "fl") return {v:-3, why:"フランジ面から控え −3"};
    if(f === "none") return {v:0, why:"継手なし 0"};
    var v = num(m); return {v:v, why:"ユニオンのねじ込み "+(isNaN(v)?"未入力":fmt(v)), manual:true};
  }
  var fitName = function(k){ for(var j=0;j<FITS.length;j++) if(FITS[j].k===k) return FITS[j].name.replace("（入力）",""); return ""; };

  function chips(box, items, cur, onpick){
    box.innerHTML = items.map(function(it){ return '<button type="button" class="chip num" data-v="'+it.v+'" aria-pressed="'+(String(it.v)===String(cur))+'">'+it.t+'</button>'; }).join("");
    box.querySelectorAll("button").forEach(function(b){ b.addEventListener("click", function(){ onpick(b.dataset.v); }); });
  }
  function drawPickers(){
    chips(document.getElementById("sizes"), S.map(function(s,i){ return {v:i, t:s.a+"A<small>("+s.b+")</small>"}; }), st.i, function(v){ st.i = +v; drawPickers(); calc(); });
    var fi = FITS.map(function(f){ return {v:f.k, t:'<span class="ico">'+f.ic+'</span>'+f.name}; });
    chips(document.getElementById("fit1"), fi, st.f1, function(v){ st.f1 = v; drawPickers(); calc(); });
    chips(document.getElementById("fit2"), fi, st.f2, function(v){ st.f2 = v; drawPickers(); calc(); });
    document.getElementById("man1").hidden = st.f1 !== "un";
    document.getElementById("man2").hidden = st.f2 !== "un";
    chips(document.getElementById("mode"), [{v:"cc", t:"芯々を測る"},{v:"wall", t:"壁から測る"},{v:"face", t:"面間・面と芯"}], st.mode, function(v){ st.mode = v; drawPickers(); calc(); });
    document.getElementById("m-cc").hidden = st.mode !== "cc";
    document.getElementById("m-wall").hidden = st.mode !== "wall";
    document.getElementById("fig-cc").hidden = st.mode !== "cc";
    document.getElementById("fig-wall").hidden = st.mode !== "wall";
    document.getElementById("m-face").hidden = st.mode !== "face";
    var RO = [{v:"face", t:"継手の面"},{v:"center", t:"継手の芯"}];
    chips(document.getElementById("r1"), RO, st.r1, function(v){ st.r1 = v; drawPickers(); calc(); });
    chips(document.getElementById("r2"), RO, st.r2, function(v){ st.r2 = v; drawPickers(); calc(); });
    document.getElementById("fflbl").textContent = st.r1 === "face" && st.r2 === "face" ? "面間（継手の端から端まで。フランジ側はフランジ面まで）" : st.r1 === "center" && st.r2 === "center" ? "芯々（継手の中心から中心まで）" : "面から芯まで（片方は継手の端、もう片方は継手の中心）";
    if(st.mode === "face") document.getElementById("fig-cc").hidden = true;
    drawPipePick();
    [["man1","r1"],["man2","r2"]].forEach(function(p){ document.querySelector("#"+p[0]+" input").placeholder = st.mode === "face" && st[p[1]] === "face" ? "ねじ込み量" : "差し引く寸法"; });
  }


  function drawPipePick(){
    var f = function(k){ return FITS.filter(function(x){ return x.k === k; })[0]; };
    [["pe1","f1","端1"],["pe2","f2","端2"]].forEach(function(p){
      var it = f(st[p[1]]), b = document.getElementById(p[0]);
      b.innerHTML = '<span class="ico">'+it.ic+'</span><b>'+it.name.replace("（入力）","").replace("（管端）","")+'</b><small>'+p[2]+'　変える ▾</small>';
      b.setAttribute("aria-expanded", openEnd === p[1]);
    });
    var pop = document.getElementById("fitpop");
    if(!openEnd){ pop.hidden = true; return; }
    pop.hidden = false;
    pop.innerHTML = '<div class="pt">'+(openEnd === "f1" ? "端1" : "端2")+'の継手</div>'+FITS.map(function(x){ return '<button type="button" data-pk="'+x.k+'" aria-pressed="'+(st[openEnd]===x.k)+'"><span class="ico">'+x.ic+'</span>'+x.name+'</button>'; }).join("");
    pop.querySelectorAll("[data-pk]").forEach(function(b){ b.onclick = function(){ st[openEnd] = b.dataset.pk; openEnd = null; drawPickers(); calc(); }; });
  }
  var openEnd = null;
  document.getElementById("pe1").addEventListener("click", function(){ openEnd = openEnd === "f1" ? null : "f1"; drawPipePick(); });
  document.getElementById("pe2").addEventListener("click", function(){ openEnd = openEnd === "f2" ? null : "f2"; drawPipePick(); });
  var last = null;
  function calc(){
    if(st.mode === "face") return calcFace();
    var wall = st.mode === "wall";
    var cc = wall ? Math.abs(num(st.w2) - num(st.w1)) : num(st.cc), d1 = ded(st.f1, st.m1), d2 = ded(st.f2, st.m2), box = document.getElementById("answer");
    last = null;
    if(isNaN(cc) || cc <= 0){ box.innerHTML = '<div class="hint">'+(wall ? '壁から2か所の寸法を入れると、切断長が出ます。' : '芯々寸法を入れると、切断長が出ます。')+'</div>'; }
    else if(isNaN(d1.v) || isNaN(d2.v)){ box.innerHTML = '<div class="hint">ユニオンの差し引く寸法を入れてください。</div>'; }
    else {
      var cut = cc - d1.v - d2.v;
      if(cut <= 0){ box.innerHTML = '<div class="hint">芯々寸法が短すぎます。継手同士が当たる長さです。</div>'; }
      else {
        last = {size:S[st.i].a+"A("+S[st.i].b+")", cc:cc, cut:cut, f1:fitName(st.f1), f2:fitName(st.f2)};
        box.innerHTML = '<div class="lbl">切断長（'+S[st.i].a+'A('+S[st.i].b+')）</div><div class="big">'+fmt(cut)+'<small>mm</small></div>'+
          '<div class="how">'+(wall ? '芯々 '+fmt(cc)+'（壁から '+fmt(num(st.w2))+' と '+fmt(num(st.w1))+' の差）<br>' : '')+fmt(cc)+' − '+d1.why+' − '+d2.why+'</div>';
      }
    }
    document.getElementById("save").disabled = !last;
    save();
  }

  function calcFace(){
    var ff = num(st.ff), box = document.getElementById("answer");
    var pick = function(r, f, m){ if(r === "center"){ var d = ded(f, m); return {v:-d.v, why:"− "+d.why}; } var a = addl(f, m); return {v:a.v, why:(a.v < 0 ? "" : "＋ ")+a.why}; };
    var a1 = pick(st.r1, st.f1, st.m1), a2 = pick(st.r2, st.f2, st.m2);
    var kname = st.r1 === "face" && st.r2 === "face" ? "面間" : st.r1 === "center" && st.r2 === "center" ? "芯々" : "面〜芯";
    last = null;
    if(isNaN(ff) || ff <= 0){ box.innerHTML = '<div class="hint">面間を入れると、切断長が出ます。</div>'; }
    else if(isNaN(a1.v) || isNaN(a2.v)){ box.innerHTML = '<div class="hint">ユニオンの寸法を入れてください。</div>'; }
    else {
      var cut = ff + a1.v + a2.v;
      if(cut <= 0){ box.innerHTML = '<div class="hint">寸法が短すぎます。継手同士が当たる長さです。</div>'; document.getElementById("save").disabled = true; save(); return; }
      last = {size:S[st.i].a+"A("+S[st.i].b+")", cc:ff, k:kname, cut:cut, f1:fitName(st.f1), f2:fitName(st.f2)};
      box.innerHTML = '<div class="lbl">切断長（'+S[st.i].a+'A('+S[st.i].b+')）</div><div class="big">'+fmt(cut)+'<small>mm</small></div>'+
        '<div class="how">'+kname+' '+fmt(ff)+' '+a1.why+' '+a2.why+'</div>';
    }
    document.getElementById("save").disabled = !last;
    save();
  }
  var STOCK = 4000; // 白ガス管 1本4m
  function sz(r){ return typeof r.size === "number" ? r.size+"A" : r.size; }
  // 4m管の取り方（長い順に、入る管に詰めていく）
  function nest(){
    var g = {};
    st.list.forEach(function(r, i){ var k = sz(r); (g[k] = g[k] || []).push({i:i, len:r.cut}); });
    return Object.keys(g).map(function(k){
      var ps = g[k].slice().sort(function(a,b){ return b.len - a.len; }), bars = [], over = [];
      ps.forEach(function(p){
        if(p.len > STOCK){ over.push(p); return; }
        var b = bars.filter(function(b){ return STOCK - b.used >= p.len; }).sort(function(x,y){ return (STOCK-x.used)-(STOCK-y.used); })[0];
        if(!b){ b = {used:0, ps:[]}; bars.push(b); }
        b.ps.push(p); b.used += p.len;
      });
      return {size:k, bars:bars, over:over};
    });
  }
  function drawList(){
    var box = document.getElementById("list"), nb = document.getElementById("nest"), cnt = document.getElementById("lcnt");
    if(!st.list.length){ box.innerHTML = '<div class="hint">計算した切断長を追加すると、ここに並びます。</div>'; nb.innerHTML = '<div class="hint">切断リストから、4m管が何本いるかと切り方を出します。</div>'; cnt.textContent = ""; document.getElementById("share").disabled = true; return; }
    document.getElementById("share").disabled = false;
    var left = st.list.filter(function(r){ return !r.done; }).length;
    cnt.textContent = left ? "残り "+left+" 本 / "+st.list.length+" 本" : "全部切りました";
    box.innerHTML = st.list.map(function(r, i){
      return '<div class="item num'+(r.done ? ' done' : '')+'"><button class="ck" type="button" data-c="'+i+'" aria-pressed="'+(!!r.done)+'" aria-label="'+(i+1)+'本目を切った">'+(r.done ? '✓' : '')+'</button>'+
        '<div><b>'+fmt(r.cut)+' <small>mm</small></b><div class="t">'+(i+1)+'本目・'+sz(r)+'・'+(r.k||'芯々')+fmt(r.cc)+'・'+r.f1+'／'+r.f2+'</div></div>'+
        '<button class="x" type="button" data-i="'+i+'" aria-label="'+(i+1)+'本目を消す">×</button></div>';
    }).join("");
    box.querySelectorAll(".x").forEach(function(b){ b.addEventListener("click", function(){ st.list.splice(+b.dataset.i,1); drawList(); save(); }); });
    box.querySelectorAll(".ck").forEach(function(b){ b.addEventListener("click", function(){ var r = st.list[+b.dataset.c]; r.done = !r.done; drawList(); save(); }); });
    nb.innerHTML = nest().map(function(g){
      return '<div class="ng"><div class="ngh">'+g.size+'：<b>4m管 '+g.bars.length+'本</b></div>'+
        g.bars.map(function(b, bi){
          var rest = STOCK - b.used;
          return '<div class="bar"><div class="bl">'+(bi+1)+'本目</div><div class="bt">'+b.ps.map(function(p){ return '<span style="flex:'+p.len+'" class="'+(st.list[p.i].done ? 'dn' : '')+'">'+fmt(p.len)+'<i>'+(p.i+1)+'本目</i></span>'; }).join("")+(rest > 0 ? '<span class="rs" style="flex:'+rest+'">残り '+fmt(rest)+'</span>' : '')+'</div></div>';
        }).join("")+
        (g.over.length ? '<div class="hint">4mより長い：'+g.over.map(function(p){ return (p.i+1)+'本目 '+fmt(p.len)+'mm'; }).join("、")+'（つなぐ必要があります）</div>' : '')+'</div>';
    }).join("");
  }
  function shareText(){
    var t = ["【切断リスト】"];
    st.list.forEach(function(r, i){ t.push((r.done ? "✓ " : "□ ")+(i+1)+"本目 "+fmt(r.cut)+"mm（"+sz(r)+"・"+(r.k||"芯々")+fmt(r.cc)+"・"+r.f1+"／"+r.f2+"）"); });
    t.push(""); t.push("【4m管の取り方】");
    nest().forEach(function(g){
      t.push(g.size+"：4m管 "+g.bars.length+"本");
      g.bars.forEach(function(b, bi){ t.push("　"+(bi+1)+"本目："+b.ps.map(function(p){ return fmt(p.len); }).join("＋")+"（残り "+fmt(STOCK-b.used)+"）"); });
      g.over.forEach(function(p){ t.push("　4mより長い："+fmt(p.len)+"mm"); });
    });
    return t.join("\n");
  }
  document.getElementById("share").addEventListener("click", function(){
    var text = shareText();
    if(navigator.share){ navigator.share({title:"切断リスト", text:text}).catch(function(){}); return; }
    var done = function(){ alert("コピーしました。Teamsのチャットに貼り付けてください。"); };
    if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done, function(){ prompt("この文をコピーしてください", text); }); } else prompt("この文をコピーしてください", text);
  });

  var ffi = document.getElementById("ff"); ffi.value = st.ff || "";
  ffi.addEventListener("input", function(){ st.ff = ffi.value; calc(); });
  ffi.addEventListener("focus", function(){ ffi.select(); });
  var cc = document.getElementById("cc"); cc.value = st.cc;
  cc.addEventListener("input", function(){ st.cc = cc.value; calc(); });
  ["w1","w2"].forEach(function(id){
    var inp = document.getElementById(id); inp.value = st[id];
    inp.addEventListener("input", function(){ st[id] = inp.value; calc(); });
    inp.addEventListener("focus", function(){ inp.select(); });
  });
  [["man1","m1"],["man2","m2"]].forEach(function(p){
    var inp = document.querySelector("#"+p[0]+" input"); inp.value = st[p[1]];
    inp.addEventListener("input", function(){ st[p[1]] = inp.value; calc(); });
  });
  document.getElementById("save").addEventListener("click", function(){
    if(!last) return; st.list.push(last); drawList(); save();
    if(st.mode === "wall"){
      st.w1 = st.w2; st.w2 = "";
      document.getElementById("w1").value = st.w1;
      var w2 = document.getElementById("w2"); w2.value = ""; calc(); w2.focus();
    } else if(st.mode === "face"){ var fi = document.getElementById("ff"); fi.value = ""; st.ff = ""; calc(); fi.focus(); }
    else { cc.value = ""; st.cc = ""; calc(); cc.focus(); }
  });
  document.getElementById("clear").addEventListener("click", function(){
    if(!st.list.length || !confirm("切断リストを全部消しますか？")) return;
    st.list = []; drawList(); save();
  });

  drawPickers(); drawList(); calc();
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
