<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>工事課ハンドブック</title>
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --ink:#1C2326; --muted:#475055; --line:#B4BCC0;
  --focus:#1F4E8C; --sel:#1C2326; --sel-ink:#FFFFFF; --warn:#9A3412; --warn-soft:#FDEBDD;
  --todo:#8A6D00; --todo-soft:#FFF3C4; --place:#1F4E8C; --place-soft:#DCE6F3;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
    --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C; --warn:#F5A97F; --warn-soft:#3A2418;
    --todo:#E8C95A; --todo-soft:#3A3213; --place:#9DBDEB; --place-soft:#24344A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A1C; --surface:#20262A; --ink:#E8ECEE; --muted:#9AA4A9; --line:#384146;
  --focus:#7FA8E0; --sel:#E8ECEE; --sel-ink:#161A1C; --warn:#F5A97F; --warn-soft:#3A2418;
  --todo:#E8C95A; --todo-soft:#3A3213; --place:#9DBDEB; --place-soft:#24344A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.back{display:inline-block;margin:0 0 6px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:.9rem}
h1{font-size:1.5rem;line-height:1.25;margin:4px 0 12px}
.search{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:1.05rem;padding:0 14px}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0 14px;padding-bottom:2px}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;font-family:inherit;font-size:.92rem;font-weight:700;padding:0 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.list{display:grid;gap:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary svg{width:56px;height:38px}
summary b{display:block;font-size:1.05rem;line-height:1.3}
summary span{font-size:.85rem;color:var(--muted)}
summary::after{content:"＋";color:var(--muted);font-size:1.2rem}
details[open] summary::after{content:"−"}
.body{padding:0 14px 14px;display:grid;gap:10px}
.sec h3{font-size:.8rem;color:var(--muted);margin:0 0 2px;font-weight:700}
.sec p{margin:0}
.sec ul{margin:0;padding-left:1.2em}
.place{background:var(--place-soft);color:var(--place);border-radius:8px;padding:8px 10px}
.place h3{color:var(--place)}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px}
.warn h3{color:var(--warn)}
.todo{background:var(--todo-soft);color:var(--todo);border-radius:6px;padding:0 6px;font-size:.9rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:700;font-size:.78rem}
th:first-child,td:first-child{text-align:left;font-weight:700}
.tnote{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.act a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--sel);color:var(--sel-ink);text-decoration:none;font-weight:700;font-size:.95rem}
.act a.sub{background:transparent;color:var(--ink);border:1px solid var(--line)}
.addform{display:grid;grid-template-columns:1fr 96px;gap:6px;margin-top:8px}
.addform input,.cartpanel input{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;padding:0 10px;min-width:0}
.addform button{grid-column:1 / 3}
.pbtn{min-height:46px;border:0;border-radius:8px;background:var(--sel);color:var(--sel-ink);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;padding:0 14px}
.gbtn{min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-family:inherit;font-size:.9rem;cursor:pointer;padding:0 14px}
.cartbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--sel);color:var(--sel-ink);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.cartpanel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.cartin{max-width:640px;margin:0 auto}
.carthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.carthead h2{margin:0;font-size:1.3rem}
.citem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.citem b{display:block}
.citem span{font-size:.85rem;color:var(--muted)}
.cfield{display:grid;gap:4px;margin-top:10px;font-size:.85rem;color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.group h3{margin:0 0 4px;font-size:1rem}
.group p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.group a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;background:var(--sel);color:var(--sel-ink);text-decoration:none;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--sel);color:var(--sel-ink);padding:10px 16px;border-radius:20px;font-size:.92rem;font-weight:700}
.wrap{padding-bottom:96px}
.ig{font-size:.9rem;margin:16px 0 6px;color:var(--muted)}
.irow{display:grid;grid-template-columns:1fr 70px 70px 64px;gap:6px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.iname{font-weight:700;font-size:.92rem;line-height:1.3;align-self:center}
.iname span{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.irow label{display:grid;gap:2px;font-size:.72rem;color:var(--muted)}
.irow input{height:40px;text-align:right;padding:0 8px}
.ishort{align-self:center;text-align:center;font-size:.82rem;font-weight:700;border-radius:6px;padding:4px 2px}
.ishort.on{background:var(--warn-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;margin:0 0 10px}
.toolbar button{flex:1}
.lead2{color:var(--muted);font-size:.9rem;margin:-6px 0 12px}
.linkbtn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;margin-top:8px}
.spec{width:100%;border-collapse:collapse;font-size:.9rem}
.spec td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;white-space:normal}
.spec td:first-child{color:var(--muted);width:45%}
.cfield textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;padding:8px 10px}
.body .cfield input{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;padding:0 10px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.pt{font-size:.92rem;margin-bottom:6px}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb button{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.pb .okb[aria-pressed="true"]{background:#2E7D4F;border-color:#2E7D4F;color:#fff}
.pb .ngb[aria-pressed="true"]{background:#C2410C;border-color:#C2410C;color:#fff}
.pnote{width:100%;margin-top:6px}
.shaken{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.92rem}
.shaken b{display:block;margin-bottom:2px}
.shk{display:inline-block;margin-top:4px;font-size:.82rem;color:var(--muted)}
.shk.on{color:var(--warn);font-weight:700}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.act2 .pbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.act2 .ghostb{background:transparent;color:var(--ink);border:1px solid var(--line)}
.act2 .dis{background:var(--line);color:var(--muted);font-weight:400;font-size:.85rem}
.tsel{grid-column:1 / 3}
.addform > input[type="text"]{grid-column:1 / 3}
.qty{grid-column:1 / 3;display:grid;grid-template-columns:52px 1fr 52px;gap:6px}
.qty input{text-align:center}
.qbtn{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:1.3rem;font-weight:700;cursor:pointer}
.tsel span{font-size:.82rem;color:var(--muted)}
.rel .chip{font-size:.85rem;min-height:38px}
img.dwg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.zoomv{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.zoomv[hidden]{display:none}
.zoombar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:#111}
.zoombar button{min-width:52px;min-height:44px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer}
.zoombar span{color:#bbb;font-size:.85rem}
.zoomarea{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#000}
.zoomarea img{display:block;width:100%;height:auto;max-width:none;background:#fff}
img.dwg{cursor:zoom-in}
.qs{margin:0;padding:0;list-style:none}
.list .body{counter-reset:q}
.qs li{counter-increment:q;display:grid;grid-template-columns:34px 96px 1fr;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.qs li::before{content:counter(q);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center}
.qs li b{font-size:1.02rem}
.qs li span{font-size:.92rem}
.qh{margin:12px 0 2px;font-weight:700;font-size:.85rem;color:#fff;background:var(--gc,#0F7B6C);border-radius:6px;padding:3px 10px;display:inline-block}
.qw{margin-top:10px;background:#FDECEA;color:#8A1C12;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.92rem;line-height:1.8}
.qn{font-size:.85rem;color:var(--muted);margin:8px 0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.bnav button{position:relative;background:none;border:0;color:var(--ink);font:inherit;font-size:.78rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;min-height:52px;cursor:pointer}
.bnav button span{font-size:1.3rem;line-height:1}
.bnav i{position:absolute;top:2px;right:calc(50% - 22px);font-style:normal;background:#B42318;color:#fff;border-radius:9px;font-size:.7rem;padding:0 6px;min-width:18px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.recent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.recent > span{font-size:.8rem;color:var(--muted);font-weight:700;width:100%}
.rchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec.fold > h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:0;padding:4px 0}
.sec.fold > h3::after{content:"＋";font-weight:700;color:var(--muted)}
.sec.fold.open > h3::after{content:"−"}
.sec.fold:not(.open) > :not(h3){display:none}
.g2r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rentf .cfield input{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1rem;padding:0 10px;width:100%}

:root{--g-mat:#2F6FD6;--g-mat-soft:#E3ECFA;--g-veh:#2E7D4F;--g-veh-soft:#E2F2E8;--g-prep:#B7791F;--g-prep-soft:#FBF0DC;--g-tnk:#7A4FC4;--g-tnk-soft:#EFE7FA;--g-work:#0F7B6C;--g-work-soft:#DDF3EF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-mat:#7FA8E0;--g-mat-soft:#1E2B3D;--g-veh:#6BC48F;--g-veh-soft:#1C2E24;--g-prep:#E2AC4E;--g-prep-soft:#33291A;--g-tnk:#B79AE8;--g-tnk-soft:#2A2238;--g-work:#5CC8B6;--g-work-soft:#173430}}
:root[data-theme="dark"]{--g-mat:#7FA8E0;--g-mat-soft:#1E2B3D;--g-veh:#6BC48F;--g-veh-soft:#1C2E24;--g-prep:#E2AC4E;--g-prep-soft:#33291A;--g-tnk:#B79AE8;--g-tnk-soft:#2A2238;--g-work:#5CC8B6;--g-work-soft:#173430}
.grps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 0}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:62px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);border-top:5px solid var(--gc);background:var(--surface);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.grp b{font-size:1.05rem}
.grp span{font-size:.72rem;color:var(--muted);line-height:1.3}
.grp[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.grp[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.g-mat{--gc:var(--g-mat);--gs:var(--g-mat-soft)} .g-veh{--gc:var(--g-veh);--gs:var(--g-veh-soft)} .g-prep{--gc:var(--g-prep);--gs:var(--g-prep-soft)} .g-tnk{--gc:var(--g-tnk);--gs:var(--g-tnk-soft)} .g-work{--gc:var(--g-work);--gs:var(--g-work-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .grp[aria-pressed="true"]{color:#161A1C} :root:not([data-theme="light"]) .grp[aria-pressed="true"] span{color:rgba(22,26,28,.8)}}
.cats[class*="g-"]{background:var(--gs);border-radius:10px;padding:8px;margin-top:8px}
.cats[class*="g-"] .chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.list[class*="g-"] > details{border-left:5px solid var(--gc)}
.list[class*="g-"] > details > summary svg{color:var(--gc)}
html{font-size:19px}
.fsz{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin:-4px 0 8px}
.fsz span{font-size:.8rem;color:var(--muted)}
.fsz .chip{min-height:34px;padding:0 12px;font-size:.85rem}
summary .fav{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--muted);padding:6px;cursor:pointer;font-family:inherit}
summary .fav[aria-pressed="true"]{color:#E0A800}
.favmark{color:#E0A800;margin-right:4px;font-size:.9em}
.favbtn{display:block;margin:4px 0 0;background:none;border:0;color:var(--muted);font-family:inherit;font-size:.85rem;padding:6px 0;cursor:pointer;text-align:left}
details.more{border:0;background:none;margin-top:4px}
details.more > summary{display:block;padding:4px 0;font-size:.85rem;font-weight:700;color:inherit;text-decoration:underline;list-style:none}
details.more > summary::after{content:none}
.empty{color:var(--muted);text-align:center;padding:20px}
.foot{font-size:.8rem;color:var(--muted);margin-top:18px}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>工事課ハンドブック</h1>
  <p class="lead2">材料・工具・機械・車両の説明、点検、棚卸し、注文がこれ1つでできます。</p>
  <div class="shaken" id="shaken" hidden></div>
  <div class="toolbar"><button type="button" class="gbtn" id="inspbtn">月次点検をする</button><button type="button" class="gbtn" id="invbtn">棚卸しをする</button></div>
  <input class="search" id="q" type="search" placeholder="名前で探す（全部の種類から探します）" aria-label="材料を名前で探す">
  <div class="recent" id="recent" hidden></div>
  <div class="grps" id="grps" role="group" aria-label="大きな分類"></div>
  <div class="cats" id="cats" role="group" aria-label="種類で絞り込む"></div>
  <div class="list" id="list"></div>
  <button class="cartbtn" id="cartbtn" type="button" hidden>カート 0</button>
  <nav class="bnav" aria-label="よく使う操作">
    <button type="button" id="nHome"><span aria-hidden="true">🏠</span>ホーム</button>
    <button type="button" id="nFind"><span aria-hidden="true">🔍</span>探す</button>
    <button type="button" id="nCart"><span aria-hidden="true">🛒</span>カート<i id="nCartN" hidden>0</i></button>
    <button type="button" id="nInsp"><span aria-hidden="true">✅</span>点検</button>
  </nav>
  <div class="cartpanel" id="cart" hidden></div>
  <div class="cartpanel" id="inv" hidden></div>
  <div class="cartpanel" id="insp" hidden></div>
  <div class="zoomv" id="zoomv" hidden role="dialog" aria-label="図面の拡大表示"><div class="zoombar"><button type="button" id="zclose" aria-label="閉じる">×</button><span id="zpct">100%</span><span><button type="button" id="zout" aria-label="縮小">−</button> <button type="button" id="zin" aria-label="拡大">＋</button></span></div><div class="zoomarea" id="zarea"><img id="zimg" alt="図面"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <p class="foot">車両の記録と点検の結果は、この端末に保存されます。共有はメールで行います。「未登録」は、会社の補充場所や注文先がまだ入っていない所です。わかったら追加します。</p>
</div>
<script>
(function(){
  var sv = function(inner){ return '<svg viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round">'+inner+'</svg>'; };
  var IC = {
    el: sv('<path d="M4 11 H27 V27" stroke-width="9"/><path d="M4 4.5 V17.5 M20.5 27 H33.5" stroke-width="2.5"/>'),

    {c:"樹脂配管", ic:IC.rp, n:"樹脂配管の施工方法（埋設・離隔・融着）", s:"埋設深度・離隔距離・埋め戻しの決まり",
     custom:'<figure style="margin:0">'+'<svg viewBox="0 0 340 210" role="img" aria-label="樹脂配管の埋設深度と離隔距離の断面図" style="width:100%;height:auto;display:block"><defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs><rect x="0" y="30" width="340" height="18" style="fill:var(--line)"/><text x="330" y="43" text-anchor="end" font-size="11" font-weight="700" fill="currentColor">舗装</text><path d="M0 30 H340" stroke="currentColor" stroke-width="2"/><text x="6" y="24" font-size="12" font-weight="700" fill="currentColor">GL</text><rect x="104" y="96" width="176" height="74" rx="4" fill="#E9D9A8" opacity=".55"/><text x="272" y="164" text-anchor="end" font-size="10" fill="currentColor">砂で埋め戻し</text><rect x="30" y="58" width="40" height="140" fill="#8A9499"/><text x="50" y="132" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">支柱</text><text x="50" y="145" text-anchor="middle" font-size="9" fill="#fff">など</text><circle cx="156" cy="128" r="18" fill="#F2C200" stroke="#7A6200" stroke-width="1.5"/><circle cx="234" cy="128" r="18" fill="#F2C200" stroke="#7A6200" stroke-width="1.5"/><path d="M156 33 V108" stroke="currentColor" stroke-width="1.5" marker-start="url(#ga)" marker-end="url(#ga)"/><path d="M140 110 H172" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/><text x="164" y="66" font-size="11" font-weight="700" fill="currentColor">コンクリート舗装 300以上</text><text x="164" y="81" font-size="11" font-weight="700" fill="currentColor">アスファルト 600以上</text><path d="M72 128 H136" stroke="currentColor" stroke-width="1.5" marker-start="url(#ga)" marker-end="url(#ga)"/><text x="104" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">120以上</text><path d="M176 128 H214" stroke="currentColor" stroke-width="1.5" marker-start="url(#ga)" marker-end="url(#ga)"/><text x="195" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">配管同士 120以上</text><path d="M195 133 V178" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/></svg>'+'<figcaption class="tnote">断面図（単位mm）。黄色が樹脂配管。</figcaption></figure>'+
     '<div class="sec place"><h3>離隔距離（会社の基準）</h3><ul><li>配管同士：120mm以上</li><li>コンクリート構造物（地下タンクの支柱も含む）から：120mm以上</li><li>配管はなるべく交差させない。やむを得ず交差するときは、ゴムマットなどのクッション材をはさむ</li></ul></div>'+
     '<div class="sec place"><h3>埋設深度（GLから管の上まで）</h3><ul><li>コンクリート舗装：300mm以上</li><li>アスファルト舗装・無舗装：600mm以上</li></ul></div>'+
     '<div class="sec"><h3>勾配</h3><p>注油管などは、地下タンクに向かって下がるよう、タンクから上り勾配1/100以上で敷設する。</p></div>'+
     '<div class="sec"><h3>埋め戻しの手順</h3><ul><li>砂で100〜150mmずつ埋め戻し、そのたびに突き棒で十分に突き固める</li><li>管の上が50mm以上になるまで砂で埋め戻す</li><li>管の下に空洞ができないよう、足などで十分に締め固める（水締めをすると締まりがよくなる）</li><li>その上は、舗装の下まで山砂か原土を突き固めて埋め戻す</li><li>土間コンを打つときは、配管の位置を表示して、鉄筋棒などで管を傷つけないようにする</li></ul></div>'+
     '<div class="sec"><h3>融着（EF接合）の流れ</h3><ul><li>管と継手に可燃性の油や蒸気がないことを確認する</li><li>EFコントローラのコネクターを継手のターミナルに差し、バーコードを読んで通電する</li><li>通電が終わったら、冷えるまで動かさない</li><li>インジケーターが継手の表面より上に出ていれば融着完了</li></ul></div>'+
     '<div class="sec warn"><h3>守ること</h3><ul><li>埋設部分では融着以外の接続をしない</li><li>金属管とのつなぎは点検ボックスの中で、フランジ接合用継手などを使う</li><li>地上の配管と点検ボックス内の接続部から先は金属配管にする</li><li>ボックスやマンホールを貫通する所はウォータープルーフを使う</li><li>施工が終わったら、配管系統ごとに評価済証を付ける</li><li>施工中は技能講習会の修了証を携帯する</li></ul></div>'
    },

    {c:"泡消火", ic:IC.foam, open:true, n:"【寸法図】QS-Guard（すぐ見る）", s:"ユニット・アンカー・配管・泡放出口の寸法", custom:"<p class=\"tnote\">図をタップすると大きく表示します（＋で拡大）。</p><div class=\"sec\"><h3>消火ユニット 配管・電線管の穴あけ位置（図16）</h3><a href=\"foam-dim-unit.jpg\" target=\"_blank\" rel=\"noopener\"><img class=\"dwg\" src=\"foam-dim-unit.jpg\" alt=\"消火ユニット 配管・電線管の穴あけ位置（図16）\"></a><p class=\"tnote\">正面の幅775・奥行583、穴は上から230の所。配管の穴は104×3ピッチ（正面）・60×3ピッチ（側面）。</p></div><div class=\"sec\"><h3>消火ユニット 固定アンカー位置（図17）</h3><a href=\"foam-dim-anchor.jpg\" target=\"_blank\" rel=\"noopener\"><img class=\"dwg\" src=\"foam-dim-anchor.jpg\" alt=\"消火ユニット 固定アンカー位置（図17）\"></a><p class=\"tnote\">4 − φ14.5、700 × 510。M10で固定。</p></div><div class=\"sec\"><h3>消火ユニット 配管寸法（表16）・配管上面図（図18）・配管例（図19）</h3><a href=\"foam-dim-piping.jpg\" target=\"_blank\" rel=\"noopener\"><img class=\"dwg\" src=\"foam-dim-piping.jpg\" alt=\"消火ユニット 配管寸法（表16）・配管上面図（図18）・配管例（図19）\"></a><p class=\"tnote\">右出し・左出し・後出しの上段／下段ラインの寸法。使用配管20A SGP白。</p></div><div class=\"sec\"><h3>泡放出口 取付断面図（図10）・アイランド周辺配管（図11）</h3><a href=\"foam-dim-head.jpg\" target=\"_blank\" rel=\"noopener\"><img class=\"dwg\" src=\"foam-dim-head.jpg\" alt=\"泡放出口 取付断面図（図10）・アイランド周辺配管（図11）\"></a><p class=\"tnote\">床から中心まで60〜70。分岐配管の長さ（L1・L2）はそれぞれ等しく。</p></div><div class=\"sec\"><h3>ヘッドケースの取付（図12〜15）</h3><a href=\"foam-dim-headcase.jpg\" target=\"_blank\" rel=\"noopener\"><img class=\"dwg\" src=\"foam-dim-headcase.jpg\" alt=\"ヘッドケースの取付（図12〜15）\"></a><p class=\"tnote\">コンクリート製アイランド・スチール型枠製アイランドの場合。</p></div><div class=\"sec\"><h3>よく使う寸法</h3><table class=\"spec\"><tr><td>消火ユニットの大きさ</td><td>幅775 × 高さ1785 × 奥行615 mm（約370 kg）</td></tr><tr><td>アンカー</td><td>4 − φ14.5、ピッチ 700 × 510 mm、M10ボルトで固定</td></tr><tr><td>配管の穴</td><td>φ40 を放射区画数の1/2の数だけ（ノックアウト・ポンチ位置）</td></tr><tr><td>電線管の穴</td><td>上 φ28（信号用）・下 φ22（電源用）</td></tr><tr><td>泡放出口の高さ</td><td>床面から中心まで 60〜70 mm</td></tr><tr><td>泡ヘッドの間隔</td><td>1500〜2000 mm が目安</td></tr><tr><td>ユニット内の配管</td><td>20A SGP 白（表16の寸法はねじ部を含む）</td></tr></table></div>"},
    {c:"泡消火", ic:IC.foam, n:"QS-Guard 仕様（ヤマトプロテック YGS-180NP）", s:"セルフSS用 パッケージ型固定泡消火設備", custom:'<div class=\"sec\"><h3>仕様</h3><table class=\"spec\"><tr><td>名称</td><td>セルフサービス方式給油取扱所用 パッケージ型固定泡消火設備</td></tr><tr><td>機種</td><td>YGS-180NP（QS-Guard）</td></tr><tr><td>確認番号</td><td>第 YP-E-02号</td></tr><tr><td>消火薬剤</td><td>水成膜泡 7L</td></tr><tr><td>不凍液</td><td>173L</td></tr><tr><td>泡消火薬剤貯蔵容器</td><td>7.7L（SUS304）</td></tr><tr><td>不凍液貯蔵容器</td><td>198L（SS400）</td></tr><tr><td>加圧用ガス容器</td><td>13.4L（窒素）</td></tr><tr><td>放射圧力</td><td>0.25〜0.50 MPa</td></tr><tr><td>放射量</td><td>11.0〜18.8 L/分</td></tr><tr><td>発泡倍率</td><td>2〜6倍</td></tr><tr><td>配管</td><td>架橋ポリエチレン管 または SGP、20A・25A</td></tr><tr><td>放射区画選択弁</td><td>電気式、4放射区画ごとに1個</td></tr><tr><td>泡放出口</td><td>C3604B、1放射区画ごとに2個</td></tr><tr><td>制御盤</td><td>幅265 × 高さ165 × 奥行100 mm</td></tr><tr><td>操作箱</td><td>卓上型 240 × 70 × 205、壁掛型 240 × 205 × 70 mm</td></tr></table></div><div class=\"sec\"><h3>機種と区画数</h3><table class=\"spec\"><tr><td>YGS-180NP-01</td><td>1〜4区画・選択弁1個</td></tr><tr><td>YGS-180NP-02</td><td>1〜8区画・選択弁2個</td></tr><tr><td>YGS-180NP-03</td><td>1〜12区画・選択弁3個</td></tr><tr><td>YGS-180NP-04</td><td>1〜16区画・選択弁4個</td></tr><tr><td>YGS-180NP-05</td><td>1〜20区画・選択弁5個</td></tr><tr><td>YGS-180NP-06</td><td>1〜24区画・選択弁6個</td></tr></table></div>'},
    {c:"泡消火", ic:IC.foam, n:"QS-Guard 据付・配管・泡放出口の手順", s:"取扱説明書のポイント", custom:'<div class=\"sec\"><h3>消火ユニットの据付</h3><ol style=\"margin:0;padding-left:1.4em\"><li>配管を出す方向（左・右・背面）を現場に合わせて決める</li><li>配管の穴 φ40 を放射区画数の1/2だけ、電線管の穴を上 φ28・下 φ22 であける（ノックアウト・ポンチ位置）</li><li>穴のバリを取り、配管の穴にゴムブッシュを付ける</li><li>設置場所が水平で平らか確認し、アンカーの穴をあける（4 − φ14.5、700 × 510）</li><li>アンカーを打ち、ユニットを据え付け、水平を確認してM10ボルトで固定する</li></ol></div><div class=\"sec\"><h3>ユニットの配管</h3><ul><li>主配管とユニットは、絶縁のため<b>ユニオン</b>でつなぐ</li><li>ユニオンは隣の配管に当たらないよう、垂直部分で<b>千鳥</b>に配置する</li><li>立ち上がり・立ち下がりに<b>フレキ</b>を使うと合わせ作業が楽</li><li>ユニット内の配管は20A SGP白（寸法表はねじ部込み）</li></ul></div><div class=\"sec\"><h3>泡放出口までの配管</h3><ul><li>使える配管：<b>GSガードユカロンエクセルパイプ</b>（埋設◎・架空×）、<b>SGP または SGP-PD</b>（埋設○・架空◎）、管径20A、全損失0.25 MPa</li><li>樹脂の配管・継手は<b>GSガードユカロンエクセルパイプだけ</b>。ほかは使えない</li><li>ユニットからの配管1本で2区画（泡放出口4個）に同時に出る。<b>アイランドごとに1系統</b>で、必ず両側に同時に出るように配管する</li><li>シール剤は<b>日本ヘルメチック製 ヘルメシール55</b>を推奨</li></ul></div><div class=\"sec\"><h3>泡放出口の取付</h3><ul><li>床から中心まで60〜70 mm、ヘッドの間隔は1500〜2000 mmが目安</li><li>分岐配管の長さは、それぞれ等しくする</li><li><b>コンクリートのアイランド</b>：型枠にφ30の円を書き、中心にφ12の穴 → ヘッドケース内側にグリス → 継手に接続し六角ボルトで型枠を挟む → 防食テープを巻く → 打設 → 硬化後ボルトを外し、入ったコンクリートをウエスで取る</li><li>モルタルで後から仕上げるときは、ヘッドキャップ部（φ40以上）をよける</li><li><b>スチール型枠のアイランド</b>：φ32の穴 → ヘッドケースが型枠より出ないように、ティグ溶接（2点以上）で固定</li></ul></div>'},

    if(tc){ tc.parentNode.querySelectorAll(".tchip").forEach(function(x){ x.setAttribute("aria-pressed", x===tc); }); return; }
    var b = e.target.closest(".addbtn"); if(!b) return;
    var f = b.closest(".addform"), ins = f.querySelectorAll("input"), m = findM(f.dataset.n);
    var qty = ins[1].value.trim();
    if(!qty){ toast("数量を入れてください"); ins[1].focus(); return; }
    var size = ins[0].value.trim();
    if(sizesOf(m)){
      var zp = f.querySelector('.zchip[aria-pressed="true"]');
      if(!zp){ toast("サイズを選んでください"); return; }
      size = zp.dataset.z;
      if(m.shape){
        var tp = f.querySelector('.tchip[aria-pressed="true"]');
        if(!tp){ toast("厚みを選んでください"); return; }
        size += "　"+m.shape+"　厚み"+tp.dataset.t;
        tp.setAttribute("aria-pressed","false");
      }
      zp.setAttribute("aria-pressed","false");
    }
    if(m.unit && /^[0-9]+$/.test(qty)) qty += m.unit;
    cart.items.push({n:m.n, size:size, qty:qty, order:m.order || ""});
    saveCart(); updateCartBtn(); ins[0].value = ""; ins[1].value = "";
    var rl = (REL[m.n]||[]).filter(function(n, i, a){ return a.indexOf(n) === i && findM(n); });
    toast(rl.length ? "カートに入れました。一緒に：" + rl.slice(0,2).join("・") + " も必要ですか？" : "カートに入れました");
  });
  document.getElementById("list").addEventListener("input", function(e){
    var k = e.target.dataset && e.target.dataset.vk; if(!k) return;
    var p = k.split("|"); vrec[p[0]] = vrec[p[0]] || {}; vrec[p[0]][p[1]] = e.target.value;
    try{ localStorage.setItem(VKEY, JSON.stringify(vrec)); }catch(err){}
    if(p[1] === "次回車検日"){ shakenAlert(); var sn = e.target.parentNode.querySelector(".shk"); var nn = document.createElement("span"); nn.innerHTML = shakenNote(p[0]); if(sn) sn.remove(); if(nn.firstChild) e.target.after(nn.firstChild); }
  });
  document.getElementById("list").addEventListener("click", function(e){
    var a = e.target.closest("[data-vmail]"); if(!a) return;
    var v = a.dataset.vmail;
    var body = VF.map(function(f){ return f+"："+(vval(v,f) || "未登録"); }).join("\n");
    a.href = "mailto:"+TEAM_CC.join(",")+"?subject="+encodeURIComponent("【車両記録】"+v+" "+today())+"&body="+encodeURIComponent(v+" の記録です。\n\n"+body);
  });
  document.getElementById("list").addEventListener("click", function(e){
    var ch = e.target.closest(".rentf .chip");
    if(ch){ ch.parentNode.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", x===ch); }); return; }
    var go = e.target.closest(".rentgo"); if(!go) return;
    var box = go.closest(".rentf"), m = findM(box.dataset.rent.replace(/&amp;/g,"&")), url = rentMail(m, box);
    if(!url){ e.preventDefault(); return; }
    go.href = url;
  });
  (function(){
    var zv = document.getElementById("zoomv"), zi = document.getElementById("zimg"), za = document.getElementById("zarea"), zp = document.getElementById("zpct"), lv = 1;
    function setLv(n){ lv = Math.max(1, Math.min(4, n)); zi.style.width = (lv*100)+"%"; zp.textContent = (lv*100)+"%"; }
    document.addEventListener("click", function(e){
      var im = e.target.closest("img.dwg"); if(!im) return;
      e.preventDefault(); zi.src = im.currentSrc || im.src; setLv(1); zv.hidden = false; document.body.style.overflow = "hidden"; za.scrollTop = 0; za.scrollLeft = 0;
    });
    document.getElementById("zclose").onclick = function(){ zv.hidden = true; document.body.style.overflow = ""; };
    document.getElementById("zin").onclick = function(){ var cx = (za.scrollLeft + za.clientWidth/2)/za.scrollWidth, cy = (za.scrollTop + za.clientHeight/2)/za.scrollHeight; setLv(lv+0.5); za.scrollLeft = cx*za.scrollWidth - za.clientWidth/2; za.scrollTop = cy*za.scrollHeight - za.clientHeight/2; };
    document.getElementById("zout").onclick = function(){ setLv(lv-0.5); };
    zi.addEventListener("dblclick", function(){ setLv(lv >= 2.5 ? 1 : lv+1); });
  })();
  document.getElementById("inspbtn").addEventListener("click", openInsp);
  document.getElementById("nHome").onclick = function(){ var qi = document.getElementById("q"); if(qi.value){ qi.value = ""; q = ""; drawList(); } document.querySelectorAll("#list > details[open]").forEach(function(d){ d.open = false; }); drawRecent(); window.scrollTo({top:0, behavior:"smooth"}); };
  document.getElementById("nFind").onclick = function(){ var qi = document.getElementById("q"); window.scrollTo({top:0, behavior:"smooth"}); setTimeout(function(){ qi.focus(); }, 250); };
  document.getElementById("nCart").onclick = function(){ document.getElementById("cartbtn").click(); };
  document.getElementById("nInsp").onclick = function(){ document.getElementById("inspbtn").click(); };
  shakenAlert();
  document.getElementById("cartbtn").addEventListener("click", openCart);
  document.getElementById("invbtn").addEventListener("click", openInv);
  updateCartBtn();
  document.getElementById("q").addEventListener("input", function(e){ q = e.target.value; drawList(); });
  drawCats(); drawList();
})();
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
