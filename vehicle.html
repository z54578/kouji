<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="theme-color" content="#1C2326">
<link rel="icon" href="icon-192.png" type="image/png">
<title>車両管理</title>
<style>
:root{--bg:#ECEEEC;--surface:#FFFFFF;--ink:#1C2326;--muted:#475055;--line:#B4BCC0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;color-scheme:dark}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:18px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 40px}
a.back{display:inline-block;padding:8px 0;color:var(--ink);text-decoration:none;font-size:1rem}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card p{margin:0}
.card p + p{margin-top:8px;color:var(--muted);font-size:.9rem}
a.vb{display:block;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:10px;padding:16px;margin-bottom:12px;color:var(--ink);text-decoration:none}
a.vb b{display:block;font-size:1.15rem}a.vb span{font-size:.88rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← メニューに戻る</a>
  <h1>車両管理</h1>
  <a class="vb" href="./zfile.html?app=veh"><b>工事課の車両</b><span>デカ・キャンター・10号車など。記録・車検・月次点検</span></a>
  <a class="vb" href="./gyomu.html?app=veh"><b>業務課の車両</b><span>ハイエース・ユニック車・移動車など。記録・車検・月次点検</span></a>
</div>
</body>
</html>
