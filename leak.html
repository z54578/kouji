<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="theme-color" content="#1C2326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ANM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>漏洩検査 記録</title>
<style>
:root{--bg:#ECEEEC;--surface:#FFFFFF;--ink:#1C2326;--muted:#475055;--line:#B4BCC0;--focus:#1F4E8C;--sel:#1C2326;--sel-ink:#FFFFFF;--err:#B42318;--err-soft:#FDECEA;--ok:#2E7D4F;--info:#1F4E8C;--info-soft:#DCE6F3;--todo:#FFF6CC;--todo-line:#D9A400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;--sel:#E8ECEE;--sel-ink:#161A1C;--err:#F59B91;--err-soft:#3A1F1C;--ok:#6BC48F;--info:#9DBDEB;--info-soft:#24344A;--todo:#3A3214;--todo-line:#C9A23A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161A1C;--surface:#20262A;--ink:#E8ECEE;--muted:#9AA4A9;--line:#384146;--focus:#7FA8E0;--sel:#E8ECEE;--sel-ink:#161A1C;--err:#F59B91;--err-soft:#3A1F1C;--ok:#6BC48F;--info:#9DBDEB;--info-soft:#24344A;--todo:#3A3214;--todo-line:#C9A23A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:6px 12px 130px}
.back{display:inline-block;margin:0 0 6px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:.9rem}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 6px}
h2{font-size:1.05rem;margin:0 0 6px}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);margin-top:10px}
label.f:first-of-type{margin-top:4px}
input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:1.05rem;padding:8px 10px}
input.bad,textarea.bad{border-color:var(--err);background:var(--err-soft);border-width:2px}
input.todo,textarea.todo{border-color:var(--todo-line);background:var(--todo)}
.chips.todo .chip[aria-pressed="false"]{border-color:var(--todo-line);background:var(--todo)}
.card.todo{border-color:var(--todo-line);background:var(--todo)}
.resume{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--info-soft);color:var(--ink);font-size:.9rem}
.resume button{margin-left:auto;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:.85rem;cursor:pointer}
.draft{display:inline-block;margin-left:6px;padding:0 8px;border-radius:10px;background:var(--todo);border:1px solid var(--todo-line);font-size:.75rem;font-weight:700;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chips.bad .chip{border-color:var(--err)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sub{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sub b{display:block}
.msg{font-size:.82rem;color:var(--err);margin-top:4px}
.info{background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 12px;font-size:.9rem}
.kv{display:grid;grid-template-columns:7em 1fr;gap:2px 10px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.bar button,.btn{width:100%;min-height:50px;border-radius:10px;border:0;background:var(--sel);color:var(--sel-ink);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.bar button[aria-disabled="true"]{background:var(--line);color:var(--muted)}
.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.state{font-size:.85rem;font-weight:700;line-height:1.3;margin:0;white-space:nowrap}
.state.ng{color:var(--err)} .state.ok{color:var(--ok)}
.miss{grid-column:1/-1;margin:0;padding-left:1.2em;font-size:.85rem;color:var(--err)}
.add{width:100%;min-height:44px;margin-top:10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);font-family:inherit;font-weight:700;cursor:pointer}
.del{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font-family:inherit;cursor:pointer;float:right}
.chk{display:flex;gap:10px;align-items:center;min-height:46px;font-size:1rem}
.chk input{width:24px;height:24px;min-height:0}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.addr{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.act{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:8px;background:var(--sel);color:var(--sel-ink);text-decoration:none;font-weight:700;font-size:.9rem}
.act.ghost2{background:transparent;color:var(--ink);border:1px solid var(--line)}
img.map{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}
.pv{font-weight:400;font-size:.82rem;color:var(--muted);margin-left:8px}
.warnbox{margin:8px 0;padding:10px 12px;border-radius:10px;background:#FFF4E5;border:1px solid #F2C38B;color:#5B3A06;font-size:.95rem;line-height:1.6}
.warnbox b{display:block;font-size:.85rem;margin-bottom:2px}
.pipes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.pipes .pl{font-size:.8rem;color:var(--muted);font-weight:700;margin-right:2px}
.pipes .pp{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:1.05rem;line-height:1.1}
.pipes .pp small{font-size:.68rem;color:var(--muted);font-weight:400}
details.office{margin-top:10px}
details.office>summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
@media (prefers-color-scheme: dark){ .warnbox{background:#3A2A12;border-color:#7A5420;color:#F6D9A8} }
.card.tight{padding:10px 12px;margin-top:8px}
.card.tight h2{font-size:1rem;margin:0 0 6px}
.hd{display:flex;align-items:center;gap:6px}
.hd h2{flex:1;margin:0;font-size:1.05rem;line-height:1.3}
.hd h2 small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.act.sm{min-height:38px;padding:0 12px;font-size:.85rem}
img.map.big{margin-top:0;border-radius:8px}
.whead,.wrow{display:grid;grid-template-columns:26px 1fr 1fr 92px;gap:6px;align-items:center}
.whead{font-size:.72rem;color:var(--muted);margin:8px 0 2px}
.wrow{margin-top:4px}
.wrow .wn{font-size:1.25rem;font-weight:700;color:#B42318;text-align:center}
.wrow input,.wrow select,.trow input,.ohm input{min-height:42px;padding:6px 8px;font-size:1rem}
.wrow input::placeholder{color:var(--muted);opacity:.55}
.wrow select{font-size:.85rem;padding:4px}
.hint{font-size:.72rem;color:var(--muted);margin:6px 0 0}
.trow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.trow:first-of-type{border-top:0;padding-top:0;margin-top:0}
.trow b{grid-column:1 / -1;font-size:.95rem}
.trow .kl{display:none}
.trow .chips{margin-top:0;flex-wrap:nowrap}
.chips.mini{gap:4px;margin-top:0}
.chips.mini .chip{min-height:38px;padding:0 12px;font-size:.88rem}
.row2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.kl{font-size:.82rem;color:var(--muted);min-width:34px}
.ohm{display:grid;grid-template-columns:auto 1fr auto auto 1fr auto;gap:4px;align-items:center;margin-top:0}
.ohm input{min-width:0;padding:6px}
.ohm .chk.sm{gap:2px;min-height:42px}.ohm .chk.sm input{width:20px;height:20px}
.ohm .kl{min-width:0;white-space:nowrap;font-size:.8rem}
.ohm label{font-size:.8rem;color:var(--muted)}
.chk.sm{font-size:.82rem;white-space:nowrap}
.mapbox{position:relative}
.mapbox img{display:block}
.wbtn{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;padding:0;border-radius:50%;border:3px solid #B42318;background:#fff;color:#B42318;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wbtn b{font-size:1.5rem;line-height:1}
.wbtn span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;padding:0 5px;border-radius:6px;background:rgba(255,255,255,.95);font-size:.78rem;font-weight:700;white-space:nowrap;line-height:1.4}
.wbtn.ok{border-color:#1D7A4A;color:#fff;background:#1D7A4A}.wbtn.ok span{color:#1D7A4A}
.wbtn.ng,.tbtn.ng{border-width:4px;border-color:#B42318;background:#FDECEC;color:#B42318}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sh-in{max-width:640px;margin:0 auto}
.sh-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sh-hd b{font-size:1.15rem}
.sh-hd .pv{font-size:.8rem;color:var(--muted)}
.sh-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
label.f.big input{font-size:1.4rem;min-height:52px}
.sh-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nowrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.act.cam{cursor:pointer;white-space:nowrap}
.pipes.ov{position:absolute;left:3px;right:3px;top:3px;z-index:2;margin:0;gap:3px;justify-content:center;flex-wrap:nowrap;align-items:stretch}
.pipes.ov .pp{min-width:0;flex:0 1 auto;padding:1px 4px;font-size:.88rem;background:rgba(255,255,255,.92);border-color:#C9D1D5;color:#1C2326}
.pipes.ov .pp small{color:#5F6B70;font-size:.66rem;white-space:nowrap}
.pipes .pp.om{min-width:44px;margin:0;border:2px solid #B42318;line-height:1.1;font-family:inherit;cursor:pointer;color:#B42318}
.pipes .pp.om.ok{border-color:#1D7A4A;color:#1D7A4A;background:#E9F7EF}
.pipes .pp.om.ng{border-width:3px;background:#FDECEC}
.hd + .mapbox,.hd + .warnbox + .mapbox{margin-top:6px}
.tbtn{position:absolute;transform:translate(-50%,-50%);width:34%;height:22%;padding:2px 10px;border-radius:999px;border:3px solid #B42318;background:#FAEEDA;color:#633806;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:inset 0 -6px 0 rgba(133,79,11,.15),0 1px 3px rgba(0,0,0,.25)}
.tbtn b{font-size:.9rem}.tbtn span{font-size:.8rem;font-weight:700}
.tbtn.ok{border-color:#1D7A4A;color:#1D7A4A;background:#E9F7EF}
.tile{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;margin-top:6px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;cursor:pointer;text-align:left}
.tile b{font-size:.95rem}.tile span{font-size:.85rem;color:var(--muted);font-weight:700}
.tile{border-color:var(--todo-line);background:var(--todo)}.tile.ok{border-color:#1D7A4A;background:var(--bg)}.tile.ok span{color:#1D7A4A}.tile.ng{border:2px solid var(--err);background:var(--err-soft)}
.wmm{display:flex;align-items:center;gap:4px;font-size:.9rem}.wmm input{width:90px;min-height:42px}
.top{display:flex;align-items:center;gap:6px;min-height:46px}
.top .back{margin:0;padding:8px 6px 8px 0;white-space:nowrap}
.top h2{flex:1;min-width:0;margin:0;font-size:1rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-all}
.top h2 small{font-weight:400;font-size:.8rem;margin-left:4px}
.top + .card{margin-top:2px}
.f1{font-size:.85rem;color:var(--muted);margin:8px 0 4px}.f1 small{font-weight:400}
.hint:empty{display:none}
.wk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.wk{gap:4px}.wk .chips.mini{gap:3px}.wk .chips.mini .chip{padding:0 8px}
.cardsep{border:0;border-top:1px solid var(--line);margin:8px 0 0}
label.f{margin-top:6px}
.g2 label.f{margin-top:6px}
.dw{display:grid;grid-template-columns:1.15fr 1fr;gap:8px}
.dw input{min-height:40px;padding:4px 8px;font-size:.92rem}
.card.mapcard{padding:0;border:0;background:transparent}
.mapcard .office{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.nowrow input{min-height:42px;font-size:.95rem}
.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px}
.nrow input[data-ik]{min-height:42px;font-size:.95rem}
.nrow .chk.sm{min-height:42px;gap:6px;font-size:.95rem}
.mapcard + .card{margin-top:4px}
details.warnbox{padding:6px 12px;margin:0 0 4px}
details.warnbox summary{cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.45;list-style:none}
details.warnbox summary::-webkit-details-marker{display:none}
details.warnbox .more{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;border:1px solid #F2C38B;font-size:.75rem;font-weight:700}
details.warnbox[open] .more{display:none}
details.warnbox ul{margin:4px 0 2px;padding-left:1.2em;font-size:.88rem}
.chip.tk{min-height:42px;padding:0 10px}
.nrow input[data-ik]{min-width:0}
.dw1 input{min-height:42px;font-size:.95rem}
.dw1 + .msg + .wk,.dw1 + .wk{margin-top:8px}
.card > .wk:first-child{margin-top:0}
.next{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--ok)}
.next span{display:block;font-size:.8rem;color:var(--muted)}
.next b{display:block;font-size:1.05rem;line-height:1.35}
.next .acts{display:flex;gap:6px;margin-top:6px}

.autobox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 6px 12px}
.autobox .pipes.ov{position:static;margin:0 0 10px}
.atanks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.autobox .tbtn{position:static;transform:none;width:46%;height:auto;min-height:62px}
.awells{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;margin-top:14px;padding-bottom:10px}
.autobox .wbtn{position:relative;transform:none}
.wadd{width:46px;height:46px;border-radius:50%;border:2px dashed #8A9499;background:#fff;color:#5F6B70;font-family:inherit;font-size:1.2rem;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wadd small{font-size:.55rem;font-weight:700}
.wdel{margin-left:auto;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--err);font-family:inherit;font-size:.8rem;cursor:pointer}
.wdel + .sh-x{margin-left:0}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px}
.mn b{display:block;font-size:.95rem;line-height:1.3}.mn small{display:block;font-size:.75rem;color:var(--muted);line-height:1.3}

.meters{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed #C9D1D5}
.meters .ml{font-size:.72rem;color:#5F6B70;width:100%;text-align:center;line-height:1}
.mt{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:3px 6px;border:1px solid #9AA4A9;border-radius:6px;background:#F4F6F7;color:#1C2326;font-family:inherit;cursor:pointer;line-height:1.15}
.mt b{font-size:.9rem}.mt small{font-size:.68rem}
.mt.soon{border:2px solid #C27C0E;background:#FFF4E5}
.mt.ng{border:2px solid #B42318;background:#FDECEC;color:#B42318}
.mt.noted{box-shadow:inset 0 0 0 2px #1F4E8C}
.mapcard > .meters{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;margin-top:-1px;padding-bottom:8px}
.pv.ng{color:var(--err);font-weight:700}.pv.soon{color:#C27C0E;font-weight:700}
.mtab{overflow-x:auto;margin-top:4px}
.mtab table{width:100%;border-collapse:collapse;font-size:.85rem}
.mtab th,.mtab td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.mtab th{font-size:.75rem;color:var(--muted);font-weight:400}
.mtab td.ng{color:var(--err);font-weight:700}.mtab td.soon{color:#C27C0E;font-weight:700}

.mbtn{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid #9AA4A9;border-radius:20px;background:#F4F6F7;color:#1C2326;font-family:inherit;font-weight:700;font-size:.92rem;cursor:pointer}
.mbtn span{font-size:.75rem;padding:0 6px;border-radius:8px;background:#fff}
.mbtn.soon{border:2px solid #C27C0E;background:#FFF4E5}.mbtn.soon span{color:#8A5A00}
.mbtn.ng{border:2px solid #B42318;background:#FDECEC}.mbtn.ng span{color:#B42318}
.mbtn.noted{box-shadow:inset 0 0 0 2px #1F4E8C}
.sh-body{max-height:52vh;overflow:auto}
.mtab tr.u1 td{border-top:2px solid var(--line)}

.tabs{display:flex;gap:4px;margin:0 0 -1px;position:relative;z-index:1}
.tab{flex:1;min-height:42px;padding:0 6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg);color:var(--muted);font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 -2px 0 #1C2326 inset}
.tab .tb{min-width:18px;padding:0 5px;border-radius:9px;background:#B42318;color:#fff;font-size:.7rem;line-height:18px}
.tab .tb.warn{background:#C27C0E}
.tabs + .pane .mapbox{border-top-left-radius:0;border-top-right-radius:0}
.tabs + .pane img.map{border-top-left-radius:0;border-top-right-radius:0}
.mpane,.vpane{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:0 0 8px 8px;padding:8px 10px 12px}

<body>
<div class="wrap">
  <a class="back" id="back0" href="./index.html">← メニューに戻る</a>
  <nav class="cutsw" id="lsw" aria-label="漏洩検査の画面"><a href="./leak-list.html">台帳</a><a href="./leak.html" aria-current="page">記録</a><a href="./leak-admin.html">現場データ作成</a></nav>
  <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">地下タンク漏洩検査 記録</h1>
  <div id="app"></div>
</div>
<div class="bar" id="bar"><div class="bar-in">
  <div class="state" id="state"></div>
  <button type="button" id="send" aria-disabled="true">送信</button>
  <ul class="miss" id="miss"></ul>
</div></div>
<script>
(function(){
  var justSent = null, nextSite = null; // 送信した直後の現場・予定表の次の現場
  // 予定表（schedule.json）から、送った現場の「次の現場」を探す
  function findNext(id, date, cb){
    fetch("schedule.json", {cache:"no-cache"}).then(function(x){ return x.json(); }).then(function(sc){
      var days = (sc.days||[]).filter(function(d){ return d.date >= date; }), col = null, idx = -1;
      if(!days.length || days[0].date !== date) return cb(null);
      Object.keys(days[0].cols).forEach(function(c){ days[0].cols[c].forEach(function(it, i){ if(col === null && it.id === id){ col = c; idx = i; } }); });
      if(col === null) return cb(null);
      var rest = days[0].cols[col].slice(idx+1);
      if(rest.length) return cb({date:date, it:rest[0]});
      for(var k=1;k<days.length;k++){ var a = days[k].cols[col]; if(a && a.length) return cb({date:days[k].date, it:a[0]}); }
      cb(null);
    }).catch(function(){ cb(null); });
  }
  function nextHtml(n){
    if(!n) return "";
    var it = n.it, p = n.date.split("-"), when = (it.tm || "") , other = n.date !== (justSentDate||"");
    var label = "次" + (other || when ? "（" + (other ? (+p[1])+"/"+(+p[2]) + (when ? " " : "") : "") + when + "）" : "");
    var q = it.id && sites[it.id] && sites[it.id].addr ? sites[it.id].addr : it.t.replace(/（[^）]*）|【[^】]*】|□\d*|SF\d*|◎\d*|回\d*/g," ").trim();
    return '<div class="next"><span>'+label+'</span><b>'+esc(it.t)+'</b><div class="acts">'+
      (it.id ? '<a class="act sm" href="./leak.html?id='+encodeURIComponent(it.id)+'">記録を開く</a>' : '')+
      '<a class="act sm ghost2" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)+'" target="_blank" rel="noopener">ナビ</a></div></div>';
  }
  var justSentDate = null, drawNow = function(){};
  var CLERK = "miwa-t@anm.co.jp,ayumi-m@anm.co.jp"; // 事務員さんのメールアドレス（送り先は固定）
  var esc = function(t){ return String(t==null?"":t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  function dec(b){ b = b.replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; return JSON.parse(decodeURIComponent(escape(atob(b)))); }
  var SK = "leak-sites-v1", sites = {};
  try{ sites = JSON.parse(localStorage.getItem(SK)) || {}; }catch(e){}
  var site = null, m = location.search.match(/[?&]d=([^&]+)/);
  if(m){ try{ site = dec(m[1]); sites[site.id] = site; localStorage.setItem(SK, JSON.stringify(sites)); }catch(e){ site = null; } }
  var app = document.getElementById("app");
  var idm = location.search.match(/[?&]id=([^&]+)/);
  if(!site && idm){
    var want = decodeURIComponent(idm[1]);
    var fail = function(t, d){ app.innerHTML = '<div class="card"><h2>'+t+'</h2><p class="lead" style="margin:0">'+d+'</p></div>'; document.getElementById("bar").hidden = true; };
    fetch("sites.json", {cache:"no-cache"}).then(function(res){ return res.json(); }).then(function(list){
      site = list.filter(function(x){ return x.id === want; })[0] || sites[want] || null;
      if(site){ sites[site.id] = site; try{ localStorage.setItem(SK, JSON.stringify(sites)); }catch(e){} start(); }
      else fail("現場が見つかりません","台帳から開き直してください。");
    }).catch(function(){ if(sites[want]){ site = sites[want]; start(); } else fail("台帳を読み込めません","電波のある所で一度開いてください。"); });
    return;
  }
  function hasDraft(id){ try{ var x = JSON.parse(localStorage.getItem("leak-rec-v1|"+id)); return !!(x && (x.nowNo || x.pump || x.lorry || (x.wells||[]).some(function(w){ return w.water; }) || (x.tanks||[]).some(function(t){ return t.level || t.rest; }))); }catch(e){ return false; } }
  if(!site){
    var ids = Object.keys(sites);
    app.innerHTML = '<div class="card"><h2>現場を選んでください</h2><p class="lead">漏洩検査の台帳から現場を選ぶと、その現場の記録用紙が開きます。</p><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="./leak-list.html">漏洩検査の台帳を開く</a></div>'+
      (ids.length ? '<div class="card"><h2>前に開いた現場</h2>'+ids.map(function(id){ return '<button type="button" class="btn ghost" style="margin-top:8px" data-open="'+esc(id)+'">'+esc(sites[id].site)+(sites[id].fac ? '　'+esc(sites[id].fac) : '')+(hasDraft(id) ? '<span class="draft">途中</span>' : '')+'</button>'; }).join("")+'</div>' : '');
    app.querySelectorAll("[data-open]").forEach(function(b){ b.onclick = function(){ site = sites[b.dataset.open]; start(); }; });
    document.getElementById("bar").hidden = true;
    return;
  }
  start();
  function start(){
    document.getElementById("bar").hidden = false; document.getElementById("back0").style.display = "none"; var lsw = document.getElementById("lsw"); if(lsw) lsw.style.display = "none";
    var done = {}; try{ done = JSON.parse(localStorage.getItem("leak-done-v1")) || {}; }catch(e){}
    var o = done[site.id];
    if(o && (!site.last || o.last > site.last)){ site.last = o.last; site.prevDate = o.prevDate; site.prevNo = o.prevNo; }
    var RK = "leak-rec-v1|"+site.id, r;
    try{ r = JSON.parse(localStorage.getItem(RK)); }catch(e){}
    var resumed = !!(r && r.saved && (r.nowNo || r.pump || r.lorry || (r.wells||[]).some(function(w){ return w.water; }) || (r.tanks||[]).some(function(t){ return t.level || t.rest; })));
    var WK = "leak-wells|"+site.id, nw = 0; try{ nw = parseInt(localStorage.getItem(WK),10) || 0; }catch(e){}
    nw = Math.max(nw, parseInt(site.wells,10) || 0);
    if(!r){ var d = new Date(); r = {date:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2), weather:"", writer:"", kind:"", nowNo:"", gw:"", pump:"", pumpNA:false, lorry:"", lorryNA:false, wells:[], tanks:[], mob:[], note:"", noteNone:false, photo:false}; }
    (function(){ var d = new Date(); r.date = d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); })();
    while(r.wells.length < nw) r.wells.push({st:"", depth:"", water:""}); r.wells.length = nw;
    while(r.tanks.length < site.tanks.length) r.tanks.push({rest:"", level:"", kensui:"", wnote:""}); r.tanks.length = site.tanks.length;
    var mobs = site.hasMob ? site.mob : [];
    while(r.mob.length < mobs.length) r.mob.push({done:"", sticker:""}); r.mob.length = mobs.length;
    var to = CLERK;
    // 最初から決まっている答え（新しい記録のときに1回だけ）
    if(!r.def){ r.def = 1; if(!r.kind) r.kind = "検査"; if(!r.note) r.noteNone = true; }
    if(r.teiki === undefined) r.teiki = !!site.teiki; // 定期点検（台帳に「定期点検あり」なら最初から押してある）
    var openW = -1, openT = -1, openO = "", showInfo = false, openM = -1, tab = "tank"; // tab：地下タンク／計量器／移動タンク
    if(!r.mnote) r.mnote = {};
    // 計量器：台帳の型式・製造番号・検定期限。製造番号の「-1」「-2」は同じ計量器のノズル
    var units = []; (site.meters||[]).forEach(function(m){ var sn = String(m["製造番号"]||"").trim(), last = units[units.length-1];
      var base = /^[-‐－]/.test(sn) && last ? last.base : sn.replace(/[-‐－]\d+$/,"");
      if(last && base && base === last.base) last.n.push(m); else units.push({base:base, n:[m]}); });
    function ym(v){ v = String(v||""); var m = v.match(/(\d{4})\s*[.\/年]\s*(\d{1,2})/); if(m) return [+m[1], +m[2]];
      m = v.match(/^H\s*(\d{1,2})[.\/](\d{1,2})/i); if(m) return [1988 + +m[1], +m[2]];
      m = v.match(/^(\d{2})[.\/](\d{1,2})$/); if(m) return [2000 + +m[1], +m[2]]; return null; }
    function due(u){ var best = null; u.n.forEach(function(m){ var y = ym(m["検定期限"]); if(y && (!best || y[0]*12+y[1] < best[0]*12+best[1])) best = y; }); return best; }
    function dueCls(y){ if(!y) return ""; var d = new Date(), now = d.getFullYear()*12 + d.getMonth()+1, t = y[0]*12 + y[1]; return t < now ? " ng" : (t - now <= 6 ? " soon" : ""); } // タップした検知管・タンク・Ω
    // 記入者：前に入れた名前をこのスマホが覚えておく
    // 記入者：ANMを最初に開いたときに登録したフルネームを使う
    var myName = ""; try{ myName = localStorage.getItem("anm-name") || localStorage.getItem("leak-writer") || ""; }catch(e){}
    if(myName) r.writer = myName;
    // 天気：現場の住所の今の天気を自動で入れる（国土地理院で住所→位置、Open-Meteoで天気）。電波がないときは手で選ぶ
    // 天候：現場の住所の天気を自動で入れる（国土地理院で住所→位置、Open-Meteoで天気）。送信のときにもう一度取り直す
    // 電波がなくて取れないときだけ、手で選ぶボタンを出す
    var wState = (site.addr && navigator.onLine !== false) ? "wait" : "fail";
    function getWeather(cb){
      var fin = false, end = function(v){ if(!fin){ fin = true; cb(v); } };
      setTimeout(function(){ end(null); }, 5000);
      if(!site.addr || navigator.onLine === false){ end(null); return; }
      fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(site.addr)).then(function(x){ return x.json(); }).then(function(a){
        if(!a || !a.length) throw 0; var c = a[0].geometry.coordinates;
        return fetch("https://api.open-meteo.com/v1/forecast?latitude="+c[1]+"&longitude="+c[0]+"&current=weather_code&timezone=Asia%2FTokyo");
      }).then(function(x){ return x.json(); }).then(function(j){
        var w = j && j.current ? j.current.weather_code : null; if(w == null) throw 0;
        end(w <= 1 ? "晴" : (w <= 48 ? "曇" : ((w >= 71 && w <= 77) || w === 85 || w === 86 ? "雪" : "雨")));
      }).catch(function(){ end(null); });
    }
    function autoWeather(){
      getWeather(function(w){
        if(w){ r.weather = w; wState = "ok"; save(); } else wState = "fail";
        var y = window.scrollY; draw(); window.scrollTo(0,y);
      });
    }
    var tried = false;
    function save(){ r.saved = Date.now(); try{ localStorage.setItem(RK, JSON.stringify(r)); }catch(e){} }
    function chips(key, opts, cur){ return '<div class="chips" data-ck="'+key+'">'+opts.map(function(o){ return '<button type="button" class="chip" data-v="'+esc(o)+'" aria-pressed="'+(cur===o)+'">'+esc(o)+'</button>'; }).join("")+'</div>'; }
    function inp(key, val, ph, mode){ return '<input data-ik="'+key+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"'+(mode ? ' inputmode="'+mode+'"' : '')+'>'; }
    var isNum = function(v){ return /^[0-9]+(\.[0-9]+)?$/.test(String(v).trim()); };
    function get(key){ var p = key.split("."), o = r; for(var i=0;i<p.length-1;i++) o = o[p[i]]; return [o, p[p.length-1]]; }
    function check(){
      var e = {}, add = function(k, msg){ e[k] = msg; };
      if(!r.weather) if(wState === "fail" && !r.weather) add("weather","天気を取れませんでした。天候を選んでください");
      if(!r.writer.trim()) add("writer","あなたのフルネームを入れてください");
      if(!r.kind) add("kind","検査か資料のどちらかを選んでください");
      if(!r.nowNo.trim()) add("nowNo","今回No.を入れてください");
      var meas = r.kind !== "資料のみ";
      if(meas){
        if(!r.pumpNA && !isNum(r.pump)) add("pump","ポンプΩを数字で入れるか「該当なし」を選んでください");
        if(!r.lorryNA && !isNum(r.lorry)) add("lorry","ローリーΩを数字で入れるか「該当なし」を選んでください");
        r.wells.forEach(function(w, i){
          if(!w.st) add("wells."+i+".st","検知管"+(i+1)+"の状態を選んでください");
          else if(w.st === "測定"){
            if(!isNum(w.depth)) add("wells."+i+".depth","検知管"+(i+1)+"：管の深さを数字で");
            if(!isNum(w.water)) add("wells."+i+".water","検知管"+(i+1)+"：地下水の高さを数字で");
            if(isNum(w.depth) && isNum(w.water) && +w.water > +w.depth) add("wells."+i+".water","検知管"+(i+1)+"：地下水の高さが管の深さより大きくなっています");
          }
        });
        r.tanks.forEach(function(t, i){
          var nm = "タンクNo."+site.tanks[i].no;
          if(!isNum(t.rest)) add("tanks."+i+".rest", nm+"：残量を数字で");
          else if(isNum(site.tanks[i].kl) && +t.rest > +site.tanks[i].kl*1000) add("tanks."+i+".rest", nm+"：残量が容量（"+site.tanks[i].kl+"KL）を超えています");
          if(!isNum(t.level)) add("tanks."+i+".level", nm+"：油面高を数字で");
          if(!t.kensui) add("tanks."+i+".kensui", nm+"：検水（タンク内の水の混入）のなし・ありを選んでください");
          else if(t.kensui === "あり" && !String(t.wnote||"").trim()) add("tanks."+i+".wnote", nm+"：タンク内の水の高さ（mm）を入れてください");
        });
        r.mob.forEach(function(v, i){
          if(!v.done) add("mob."+i+".done","車両"+(i+1)+"：検査の実施を選んでください");
          if(v.done === "実施" && !v.sticker.trim()) add("mob."+i+".sticker","車両"+(i+1)+"：今回のステッカーNo.を入れてください");
        });
      }
      if(!r.noteNone && !r.note.trim()) add("note","特記事項を書くか「なし」にチェックしてください");
      return e;
    }
    function contactsHtml(){
      var cs = (site.contacts||[]).filter(function(c){ return c.tel; });
      if(!cs.length && site.tel) cs = [{name:"TEL", tel:site.tel}];
      if(!cs.length) return "";
      var msg = (site.site||"")+" "+(site.attn||"ご担当者様")+"\nいつもお世話になっております。地下タンク漏洩検査の日程のご相談です。\n〇月〇日（〇）〇時ごろに伺いたいのですが、ご都合はいかがでしょうか。";
      return '<div class="addr">'+cs.map(function(c){ var n = c.tel.replace(/[^0-9+]/g,""); return '<div>'+esc(c.name)+'　'+esc(c.tel)+'</div><div class="acts"><a class="act" href="tel:'+n+'">電話する</a>'+(/^0[789]0/.test(n) ? '<a class="act ghost2" href="sms:'+n+'?&body='+encodeURIComponent(msg)+'">日程をSMSで連絡</a>' : '')+'</div>'; }).join("")+'</div>';
    }
    drawNow = function(){ draw(); };
    function draw(){
      r.wells.forEach(function(w, i){
        if(!w.st) w.st = "測定";
        if(w.st === "測定" && !w.depth){ var dd = String((site.prevWells||[])[i]||"").split(/[／/]/)[0].replace(/[^0-9]/g,""); if(dd) w.depth = dd; } // 管の深さはふつう変わらない
      });
      var e = check(), eNg = tried ? e : {}; // 送る前は黄色（まだ）、送るを押した後は赤
      var bad = function(k){ return e[k] ? (tried ? ' bad' : ' todo') : ''; }, msg = function(k){ return eNg[k] ? '<div class="msg">'+esc(eNg[k])+'</div>' : ''; };
      // 縦を短く：現場（最小限）→ 現場図と検知管 → タンク → 地下水・絶縁 → 基本 の順
      var pipes = [["注入",site.d_in],["計量",site.d_meas],["吸引",site.d_suc],["戻り",site.d_ret],["送油",site.d_feed],["通気",site.d_vent]].filter(function(x){ return x[1] && x[1] !== "-" && x[1] !== "−"; });
      var mini = function(k, opts, cur){ return chips(k, opts, cur).replace('class="chips"','class="chips mini'+bad(k)+'"'); };
      var cs = (site.contacts||[]).filter(function(c){ return c.tel; }); if(!cs.length && site.tel) cs = [{name:"TEL", tel:site.tel}];
      var ov = r.kind !== "資料のみ" && site.map && (site.wellPos||[]).length >= r.wells.length && (r.wells.length || (site.tankGroups||[]).length || (site.tankPos||[]).length); // 現場と図を1枚にまとめる
      var auto = r.kind !== "資料のみ" && !ov; // 現場図がない現場：同じ形の簡易図を自動で作る
      var useTabs = (ov || auto) && (units.length || r.mob.length);
      if(!useTabs) tab = "tank";
      var oOk = function(k){ return r[k+"NA"] || isNum(r[k]); };

        '<div class="nowrow" style="margin-top:8px">'+inp("nowNo",r.nowNo,"今回No.（前回 "+(site.prevNo||"不明").replace(/^(No|№)[,.\s]*/i,"")+"）").replace('<input','<input aria-label="今回No." class="'+bad("nowNo")+'"')+'<label class="act sm cam">📷 読む<input type="file" accept="image/*" capture="environment" data-ocr="1" hidden></label></div><p class="hint" id="ocrmsg"></p>'+msg("nowNo");
      h += '<div class="nrow"><button type="button" class="chip tk" data-tk="1" aria-pressed="'+!!r.teiki+'">定期点検</button>'+inp("note",r.note,r.noteNone ? "特記事項：なし" : "特記事項").replace('<input','<input aria-label="特記事項" class="'+bad("note")+'"')+'<label class="chk sm"><input type="checkbox" data-cb="noteNone"'+(r.noteNone?' checked':'')+'>なし</label></div>'+msg("note")+'</div>';
      if(justSent === site.id){ var ls = {}; try{ ls = JSON.parse(localStorage.getItem("leak-sent|"+site.id)) || {}; }catch(x){} var bn = '<div class="resume"><span>送信画面を開きました。前回No.を「'+esc(ls.no||"")+'」に更新しました</span>'+(ls.href ? '<a class="act sm" href="'+esc(ls.href)+'">メールをもう一度開く</a>' : '')+'</div>'+nextHtml(nextSite); h = h.replace('@@TOP@@', bn); resumed = false; }
      if(resumed){ var sd = new Date(r.saved); h = h.replace('@@TOP@@', '<div class="resume"><span>途中の入力から続けています（'+(sd.getMonth()+1)+'/'+sd.getDate()+' '+sd.getHours()+':'+("0"+sd.getMinutes()).slice(-2)+' 保存）</span><button type="button" id="fresh">消して最初から</button></div>'); }
      h = h.replace('</div><!--ohmend--><div class="card tight">', '<hr class="cardsep">');
      h = h.replace(/<p class="hint">番号[^<]*<\/p>/, '');
      h = h.replace('@@TABS@@','').replace('@@PANES@@','').replace('@@UNDER@@','');
      app.innerHTML = h.replace('@@TOP@@','');
      wire(); status();
    }
    function status(){
      var e = check(), n = Object.keys(e).length, el = document.getElementById("state"), sb = document.getElementById("send");
      el.className = "state " + (n ? "ng" : "ok");
      el.textContent = n ? "残り "+n+" か所" : "送信できます";
      sb.setAttribute("aria-disabled", n ? "true" : "false");
      var ul = document.getElementById("miss");
      ul.innerHTML = tried && n ? Object.keys(e).slice(0,6).map(function(k){ return '<li>'+esc(e[k])+'</li>'; }).join("")+(n>6?'<li>ほか '+(n-6)+' か所</li>':'') : '';
    }
    function wire(){
      app.querySelectorAll("[data-ck]").forEach(function(box){ box.querySelectorAll(".chip").forEach(function(b){ b.onclick = function(){ var g = get(box.dataset.ck); g[0][g[1]] = b.dataset.v; save(); var y = window.scrollY; draw(); window.scrollTo(0,y); if(openW >= 0 || openT >= 0){ var f = app.querySelector(".sheet .wfocus"); if(f) f.focus(); } }; }); });
      app.querySelectorAll("[data-ik]").forEach(function(el){ el.oninput = function(){ var g = get(el.dataset.ik); g[0][g[1]] = el.value; if(el.dataset.ik === "note" && el.value.trim() && r.noteNone){ r.noteNone = false; var nc = app.querySelector('[data-cb="noteNone"]'); if(nc) nc.checked = false; el.placeholder = "特記事項"; } if(el.dataset.ik === "writer"){ try{ localStorage.setItem("anm-name", el.value.trim()); }catch(e){} } save(); status(); var e2 = check(); el.classList.toggle("todo", !tried && !!e2[el.dataset.ik]); }; el.onblur = function(){ if(tried){ var y = window.scrollY; draw(); window.scrollTo(0,y); } }; });
      var reopenT = function(i){ openW = -1; openO = ""; openM = -1; openT = i; var y = window.scrollY; draw(); window.scrollTo(0,y); var f = app.querySelector(".wfocus"); if(f){ f.focus(); } };
      app.querySelectorAll("[data-topen]").forEach(function(b){ b.onclick = function(){ reopenT(+b.dataset.topen); }; });
      app.querySelectorAll("[data-tgo]").forEach(function(b){ b.onclick = function(){ reopenT(+b.dataset.tgo); }; });
      var reopen = function(i){ openT = -1; openO = ""; openM = -1; openW = i; var y = window.scrollY; draw(); window.scrollTo(0,y); var f = app.querySelector(".wfocus"); if(f){ f.focus(); } };
      app.querySelectorAll("[data-wopen]").forEach(function(b){ b.onclick = function(){ reopen(+b.dataset.wopen); }; });
      app.querySelectorAll("[data-wgo]").forEach(function(b){ b.onclick = function(){ reopen(+b.dataset.wgo); }; });
      var tk = app.querySelector("[data-tk]"); if(tk) tk.onclick = function(){ r.teiki = !r.teiki; save(); var y = window.scrollY; draw(); window.scrollTo(0,y); };
      var ib = app.querySelector("[data-info]"); if(ib) ib.onclick = function(){ showInfo = !showInfo; var y = window.scrollY; draw(); window.scrollTo(0,y); };
      app.querySelectorAll("[data-oopen]").forEach(function(b){ b.onclick = function(){ openW = -1; openT = -1; openM = -1; openO = b.dataset.oopen; var y = window.scrollY; draw(); window.scrollTo(0,y); var f = app.querySelector(".sheet .wfocus"); if(f) f.focus(); }; });
      var wa = app.querySelector("[data-wadd]"); if(wa) wa.onclick = function(){ r.wells.push({st:"測定", depth:"", water:""}); try{ localStorage.setItem(WK, r.wells.length); }catch(e){} save(); openT = -1; openO = ""; openW = r.wells.length-1; var y = window.scrollY; draw(); window.scrollTo(0,y); var f = app.querySelector(".sheet .wfocus"); if(f) f.focus(); };
      var wd = app.querySelector("[data-wdel]"); if(wd) wd.onclick = function(){ if(!confirm("検知管"+r.wells.length+"を消しますか？")) return; r.wells.pop(); try{ localStorage.setItem(WK, r.wells.length); }catch(e){} save(); openW = -1; var y = window.scrollY; draw(); window.scrollTo(0,y); };
      app.querySelectorAll("[data-dry]").forEach(function(b){ b.onclick = function(){ var w = r.wells[+b.dataset.dry]; w.water = "0"; save();
        if(w.depth === ""){ var y = window.scrollY; draw(); window.scrollTo(0,y); var f = app.querySelector('.sheet [data-ik$=".depth"]'); if(f) f.focus(); return; } // 深さがまだなら深さへ
        openW = -1; var y2 = window.scrollY; draw(); window.scrollTo(0,y2); }; });
      app.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ tab = b.dataset.tab; openW = -1; openT = -1; openO = ""; var y = window.scrollY; draw(); window.scrollTo(0,y); }; });
      app.querySelectorAll("[data-mlist]").forEach(function(b){ b.onclick = function(){ openW = -1; openT = -1; openO = ""; openM = 0; var y = window.scrollY; draw(); window.scrollTo(0,y); }; });
      app.querySelectorAll("[data-wclose]").forEach(function(b){ b.onclick = function(){ openW = -1; openT = -1; openO = ""; openM = -1; var y = window.scrollY; draw(); window.scrollTo(0,y); }; });
      var ocr = app.querySelector("[data-ocr]");
      if(ocr) ocr.onchange = function(){
        var f = ocr.files && ocr.files[0], m = document.getElementById("ocrmsg"); if(!f) return;
        var say = function(t){ if(m) m.textContent = t; };
        say("読み取り中…（はじめては準備に少しかかります）");
        var run = function(){ Tesseract.recognize(f, "eng").then(function(res){
          var t = (res.data.text||"").toUpperCase().replace(/[－ｰ—–]/g,"-").replace(/O/g,"0");
          var hit = t.match(/[A-Z]\s*-?\s*\d{6}/);
          if(!hit){ say("読み取れませんでした。番号が大きく写るように撮り直すか、手で入れてください"); return; }
          var no = hit[0].replace(/\s/g,"").replace(/^([A-Z])-?/,"$1-");
          r.nowNo = r.nowNo && r.nowNo.indexOf(no) < 0 ? r.nowNo + "〜" + no.replace(/^[A-Z]-\d{3}/,"") : no;
          save(); var y = window.scrollY; draw(); window.scrollTo(0,y); var m2 = document.getElementById("ocrmsg"); if(m2) m2.textContent = "読み取りました：" + no + "（違っていたら直してください）";
        }).catch(function(){ say("読み取れませんでした。電波のある所で試すか、手で入れてください"); }); };
        if(window.Tesseract) run(); else { var sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload = run; sc.onerror = function(){ say("読み取りの準備ができませんでした。電波のある所で試してください"); }; document.head.appendChild(sc); }
      };
      app.querySelectorAll("[data-sk]").forEach(function(el){ el.onchange = function(){ var g = get(el.dataset.sk); g[0][g[1]] = el.value; save(); var y = window.scrollY; draw(); window.scrollTo(0,y); }; });
      app.querySelectorAll("[data-cb]").forEach(function(el){ el.onchange = function(){ r[el.dataset.cb] = el.checked; if(el.dataset.cb === "noteNone" && el.checked) r.note = ""; save(); var y = window.scrollY; draw(); window.scrollTo(0,y); }; });
      var fr = document.getElementById("fresh"); if(fr) fr.onclick = function(){ if(!confirm("この現場の入力を全部消して、最初からにしますか？")) return; localStorage.removeItem(RK); start(); window.scrollTo(0,0); };
    }
    function fmtJ(d){ var p = String(d).split("-"); return p.length===3 ? p[0]+"年"+(+p[1])+"月"+(+p[2])+"日" : d; }
    function body(){
      var L = [];
      L.push("■現場"); L.push("現場名："+site.site); if(site.fac) L.push("施設名："+site.fac); if(site.addr) L.push("住所："+site.addr);
      L.push("依頼先："+(site.req||"")+"／発送先："+(site.ship||"")+"／部数："+(site.copies||"")+"／周期："+(site.cycle||""));
      L.push("前回："+(site.prevDate||"")+"　No."+(site.prevNo||""));
      L.push(""); L.push("■今回"); L.push("日付："+r.date+"　天候："+r.weather); L.push("記入者："+r.writer+"　区分："+r.kind); L.push("今回No.："+r.nowNo);
      if(r.kind !== "資料のみ"){
        var gwAuto = r.wells.some(function(w){ return w.st === "測定" && +w.water > 0; }) ? "有" : "無"; // 検知管の地下水から自動
        L.push("地下水："+(r.wells.length ? gwAuto : (r.gw||"−"))+"　ポンプΩ："+(r.pumpNA?"該当なし":r.pump)+"　ローリーΩ："+(r.lorryNA?"該当なし":r.lorry));
        if(r.wells.length){ L.push(""); L.push("■漏洩検知管（管の深さ／地下水の高さ mm）"); r.wells.forEach(function(w,i){ L.push((i+1)+"："+(w.st==="測定" ? w.depth+"／"+w.water : w.st)); }); }
        L.push(""); L.push("■タンク（残量ℓ・油面高mm・検水＝タンク内の水の混入）"); r.tanks.forEach(function(t,i){ var st = site.tanks[i]; L.push("No."+st.no+" "+st.oil+" "+st.kl+"KL："+t.rest+"ℓ・"+t.level+"mm・タンク内の水"+t.kensui+(t.kensui==="あり" ? "（"+t.wnote+"mm）" : "")); });
        if(r.mob.length){ L.push(""); L.push("■移動タンク"); r.mob.forEach(function(v,i){ var mv = mobs[i]||{}; L.push((mv["車番"]||("車両"+(i+1)))+"："+v.done+(v.done==="実施" ? "　ステッカーNo."+v.sticker : "")); }); }
      }
      L.push(""); L.push("■特記事項"); L.push(r.noteNone ? "なし" : r.note);
      if(String(r.mnoteAll||"").trim()){ L.push(""); L.push("■計量器（台帳と違っていた所）"); L.push(r.mnoteAll); } L.push("定期点検："+(r.teiki ? "あり" : "なし"));
      
      L.push(""); L.push("■台帳の更新"); L.push("前回の日付 → "+fmtJ(r.date)+"／前回No. → "+r.nowNo);
      return L.join("\n");
    }
    document.getElementById("send").onclick = function(){
      tried = true;
      var e = check();
      if(Object.keys(e).length){ var fk = Object.keys(e).filter(function(k){ return /^(wells|tanks|pump|lorry|mob)/.test(k); })[0] || ""; if(/^(wells|tanks|pump|lorry)/.test(fk)) tab = "tank"; else if(/^mob/.test(fk)) tab = "mob"; draw(); var first = app.querySelector(".bad, .ng"); if(first) first.scrollIntoView({behavior:"smooth", block:"center"}); return; }
      var sb = document.getElementById("send"), st = document.getElementById("state");
      if(sb.dataset.busy) return;
      sb.dataset.busy = "1"; st.className = "state"; st.textContent = "天気を確認中…";
      getWeather(function(w){
        delete sb.dataset.busy;
        if(w){ r.weather = w; wState = "ok"; }
        else if(!r.weather){ wState = "fail"; draw(); var f = app.querySelector("[data-ck='weather']"); if(f) f.scrollIntoView({behavior:"smooth", block:"center"}); return; }
        sendNow();
      });
    };
    function sendNow(){
      var td = new Date(); r.date = td.getFullYear()+"-"+("0"+(td.getMonth()+1)).slice(-2)+"-"+("0"+td.getDate()).slice(-2); // 日付は送信した日
      if(myName) r.writer = myName;
      var href = "mailto:"+to+"?subject="+encodeURIComponent("【漏洩検査】"+site.site+(site.fac?" "+site.fac:"")+" "+r.date)+"&body="+encodeURIComponent(body());
      // 送信と同時に台帳の前回No.・前回の日付を更新して、入力を消す（メールを送り損ねたときのために中身は残しておく）
      done[site.id] = {last:r.date, prevDate:fmtJ(r.date), prevNo:r.nowNo};
      try{ localStorage.setItem("leak-done-v1", JSON.stringify(done)); localStorage.setItem("leak-sent|"+site.id, JSON.stringify({href:href, no:r.nowNo, at:Date.now()})); }catch(x){}
      localStorage.removeItem(RK); justSent = site.id; justSentDate = r.date; nextSite = null;
      var sentId = site.id; findNext(sentId, r.date, function(n){ if(justSent !== sentId) return; nextSite = n; if(n){ var y = window.scrollY; drawNow(); window.scrollTo(0,y); } });
      location.href = href;
      setTimeout(function(){ start(); window.scrollTo(0,0); }, 300);
    }
    draw(); autoWeather();
  }
})();
</script>
<script>
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
